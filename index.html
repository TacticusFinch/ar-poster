<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Magic Chess Poster</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- A-Frame + MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }

    #app, a-scene {
      width: 100%;
      height: 100%;
    }

    /* Камера MindAR на весь экран */
    #mindar-image-video {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    a-scene canvas {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Стартовый экран для разблокировки аудио */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1b1b2f 0%, #0d0d15 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      transition: opacity 0.4s ease;
    }

    #start-btn {
      margin-top: 24px;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #00e0ff 0%, #a200ff 100%);
      border: none;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(162, 0, 255, 0.5);
      cursor: pointer;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #start-btn:active {
      transform: scale(0.96);
    }

    /* Блок UI-кнопок */
    #buttons {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
      transform-origin: center center;
    }

    #buttons.show {
      opacity: 1;
      pointer-events: auto;
    }

    #buttons a {
      --glow1: #00e0ff;
      --glow2: #a200ff;

      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .5px;
      padding: 12px 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--glow1) 0%, var(--glow2) 100%);
      box-shadow: 0 0 12px var(--glow1), 0 0 24px var(--glow2);
      transition: transform .18s ease, filter .25s ease;
      white-space: nowrap;
    }

    #buttons a:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <!-- Стартовая кнопка для разблокировки звука и камеры -->
  <div id="start-screen">
    <h2 style="margin: 0; font-size: 1.5rem;">Шахматная школа "Тактикус Финч"</h2>
    <p style="margin-top: 10px; color: #aaa; max-width: 280px; font-size: 0.95rem;">
      Разрешите доступ к камере и наведите телефон на постер
    </p>
    <button id="start-btn">Смотреть</button>
  </div>

  <div id="app">
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; uiScanning: false; uiLoading: false; autoStart: false;"
      color-space="sRGB"
      embedded
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- playsinline и webkit-playsinline критичны для работы на iOS Safari -->
        <video id="wizard" src="wizard.mp4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="ar-target" mindar-image-target="targetIndex: 0" ui-follow="ui: #buttons; offsetY: 90; baseWidth: 350">
        <a-video src="#wizard" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <!-- Появляющиеся кнопки -->
    <div id="buttons">
      <a id="play" href="https://lichess.org/ru/learn" target="_blank" rel="noopener">Играть</a>
      <a id="sign" href="https://t.me/Gyatzo" target="_blank" rel="noopener">Записаться</a>
    </div>
  </div>

  <script>
    AFRAME.registerComponent('ui-follow', {
      schema: {
        ui: { type: 'selector' },
        offsetY: { type: 'number', default: 0 },
        baseWidth: { type: 'number', default: 350 }
      },
      init() {
        this.uiEl = this.data.ui;
        this.offsetY = this.data.offsetY;
        this.baseWidth = this.data.baseWidth;
        this.visible = false;
        this.leftVec = new THREE.Vector3(-0.5, 0, 0);
        this.rightVec = new THREE.Vector3(0.5, 0, 0);

        this.el.addEventListener('targetFound', () => { this.visible = true; });
        this.el.addEventListener('targetLost', () => { 
          this.visible = false; 
          this.uiEl.classList.remove('show');
        });
      },
      tick() {
        if (!this.visible) return;
        const camera = this.el.sceneEl.camera;
        if (!camera) return;

        const worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        worldPos.project(camera);

        const x = (worldPos.x + 1) / 2 * window.innerWidth;
        const y = (-worldPos.y + 1) / 2 * window.innerHeight + this.offsetY;

        const leftW = this.leftVec.clone().applyMatrix4(this.el.object3D.matrixWorld);
        const rightW = this.rightVec.clone().applyMatrix4(this.el.object3D.matrixWorld);
        leftW.project(camera);
        rightW.project(camera);

        const widthNDC = Math.abs(rightW.x - leftW.x);
        const posterPx = widthNDC * 0.5 * window.innerWidth;

        const scale = posterPx / this.baseWidth;
        this.uiEl.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale})`;
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("a-scene");
      const video = document.querySelector("#wizard");
      const anchor = document.querySelector("#ar-target");
      const ui = document.querySelector("#buttons");
      const plane = anchor.querySelector("a-video");
      const startScreen = document.querySelector("#start-screen");
      const startBtn = document.querySelector("#start-btn");

      let isVideoEnded = false;

      // Корректные пропорции плоскости
      video.addEventListener("loadedmetadata", () => {
        const ratio = video.videoHeight / video.videoWidth;
        plane.setAttribute("width", 1);
        plane.setAttribute("height", ratio);
      });

      // Полноэкранный видеопоток камеры
      scene.addEventListener("renderstart", () => {
        const camVideo = document.querySelector("#mindar-image-video");
        if (camVideo) camVideo.style.objectFit = "cover";
      });

      // Логика запуска AR по кнопке «Смотреть»
      startBtn.addEventListener("click", () => {
        startScreen.style.opacity = "0";
        setTimeout(() => startScreen.remove(), 400);

        // Прогреваем видео (без этого iOS блокирует звук)
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(() => {});

        // Стартуем сканирование MindAR
        scene.systems["mindar-image-system"].start();
      });

      // При наведении на постер
      anchor.addEventListener("targetFound", () => {
        if (!isVideoEnded) {
          video.play();
        } else {
          ui.classList.add("show");
        }
      });

      // При потере постера из кадра
      anchor.addEventListener("targetLost", () => {
        video.pause();
      });

      // По окончании ролика показываем кнопки
      video.addEventListener("ended", () => {
        isVideoEnded = true;
        ui.classList.add("show");
      });
    });
  </script>
</body>
</html>
