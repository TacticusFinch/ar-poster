<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тактикус Финч — Чемпионы мира по шахматам</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
        :root {
            --accent-color: #00ffcc;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #000;
        }

        /* Прелоадер и стартовая инструкция */
        #scanner-hint {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #00ffcc;
            z-index: 100;
            text-align: center;
            padding: 24px;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #scanner-hint.hidden {
            opacity: 0;
        }
        .spinner {
            border: 3px solid rgba(0, 255, 204, 0.2);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Переключатель звука */
        #sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 12, 18, 0.85);
            border: 1px solid var(--accent-color);
            color: #fff;
            border-radius: 8px;
            padding: 9px 16px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 120;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* Нижнее меню из трех кнопок */
        #interactive-dock {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            display: none;
            justify-content: space-between;
            gap: 10px;
            z-index: 110;
        }
        .dock-btn {
            flex: 1;
            padding: 13px 6px;
            border-radius: 10px;
            background: rgba(12, 15, 22, 0.88);
            border: 1px solid var(--accent-color);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, background-color 0.2s;
        }
        .dock-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Модальные окна */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
            box-sizing: border-box;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #0d1117;
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            padding: 22px;
            color: #fff;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            max-height: 84vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #aaa;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 4px;
            padding-right: 70px;
            letter-spacing: 0.3px;
        }
        .modal-subtitle {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        /* Оформление текста биографии */
        .bio-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            margin-top: 16px;
            margin-bottom: 6px;
        }
        .bio-paragraph {
            font-size: 13px;
            line-height: 1.55;
            color: #ccc;
            margin-bottom: 10px;
            text-align: justify;
        }
        .modal-quote {
            font-style: italic;
            color: #ddd;
            font-size: 12px;
            line-height: 1.45;
            border-left: 2px solid var(--accent-color);
            padding-left: 10px;
            margin: 14px 0;
            background: rgba(255, 255, 255, 0.03);
            padding-top: 6px;
            padding-bottom: 6px;
        }

        /* Задачи */
        .puzzle-option-btn {
            width: 100%;
            text-align: left;
            padding: 12px;
            font-size: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .puzzle-option-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Шкалы характеристик */
        .stat-row {
            margin-bottom: 12px;
        }
        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ccc;
        }
        .stat-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
        }
        .skill-box {
            margin-top: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <div id="scanner-hint">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.5px;">НАВЕДИТЕ КАМЕРУ НА ВИЗИТКУ</div>
        <div style="font-size: 12px; color: #888; margin-top: 6px;">Стейниц, Ласкер или Капабланка</div>
    </div>

    <button id="sound-toggle">ЗВУК: ВЫКЛ</button>

    <div id="interactive-dock">
        <button class="dock-btn" onclick="openModal('bio')">Биография</button>
        <button class="dock-btn" onclick="openModal('puzzle')">Задача</button>
        <button class="dock-btn" onclick="openModal('stats')">Статы</button>
    </div>

    <div id="modal-container" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">Закрыть</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./cards.mind; maxTrack: 1; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 8;" 
        color-space="sRGB" 
        renderer="colorManagement: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets timeout="4000">
            <video id="vid-0" src="./steinitz.mp4" loop="true" playsinline webkit-playsinline muted preload="metadata"></video>
            <video id="vid-1" src="./lasker.mp4" loop="true" playsinline webkit-playsinline muted preload="metadata"></video>
            <video id="vid-2" src="./capablanca.mp4" loop="true" playsinline webkit-playsinline muted preload="metadata"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-0" mindar-image-target="targetIndex: 0">
            <a-video src="#vid-0" width="1" height="1.54" position="0 0 0"></a-video>
        </a-entity>

        <a-entity id="target-1" mindar-image-target="targetIndex: 1">
            <a-video src="#vid-1" width="1" height="1.54" position="0 0 0"></a-video>
        </a-entity>

        <a-entity id="target-2" mindar-image-target="targetIndex: 2">
            <a-video src="#vid-2" width="1" height="1.54" position="0 0 0"></a-video>
        </a-entity>

    </a-scene>

    <script>
        const HEROES = {
            0: {
                name: "Вильгельм Стейниц",
                title: "I Чемпион мира по шахматам (1886—1894)",
                color: "#00ffcc",
                quote: "«Шахматы не для слабонервных. Здесь побеждает тот, чья позиция надежна как гранит».",
                bio: [
                    {
                        title: "Происхождение и юность",
                        text: "Вильгельм Стейниц родился в Праге в бедной многодетной семье. Несмотря на слабое здоровье и хромоту, он обладал выдающимися математическими способностями. Переехав в Вену для учебы в политехническом институте, Стейниц увлекся шахматами в знаменитых венских кофейнях, что вскоре стало его главным жизненным призванием."
                    },
                    {
                        title: "Революция в теории шахмат",
                        text: "В XIX веке шахматы считались романтической игрой, где ценились лишь безрассудные атаки и жертвы фигур. Стейниц первым в истории доказал, что успешная атака невозможна без предварительной позиционной подготовки. Он сформулировал законы накопления мелких преимуществ, важности пешечной структуры и открытых линий, создав научный фундамент, на котором базируются современные шахматы."
                    },
                    {
                        title: "Борьба за титул и наследие",
                        text: "В 1886 году в матче против Иоганна Цукерторта Стейниц официально стал первым в истории признанным чемпионом мира. Он доказал силу активного использования короля в эндшпиле и оставил после себя фундаментальные труды и шахматные журналы, навсегда изменившие понимание стратегической борьбы."
                    }
                ],
                stats: [
                    { name: "Позиционная защита", val: 100 },
                    { name: "Научный расчет", val: 95 },
                    { name: "Сила воли", val: 92 },
                    { name: "Психологическое давление", val: 75 }
                ],
                skillName: "Позиционная блокада",
                skillDesc: "Методичное лишение соперника пространства и вариантов контригры.",
                puzzle: {
                    title: "Гастингс, 1895 год",
                    desc: "Черный король застрял в центре доски. Соперник ожидал отступления белых фигур. Какое решение принял первый чемпион?",
                    options: [
                        { text: "Ферзь отступает назад", correct: false, comment: "Пассивный ход. Стейниц никогда не упускал атакующую инициативу." },
                        { text: "Ладья d7! Жертва ладьи", correct: true, comment: "Верно. Ладья встает под бой трех фигур, создавая неотвратимую матовую сеть." },
                        { text: "Шах пешкой с фланга", correct: false, comment: "Неточно. Черный король успевает покинуть опасную зону." }
                    ]
                }
            },
            1: {
                name: "Эмануил Ласкер",
                title: "II Чемпион мира по шахматам (1894—1921)",
                color: "#c0392b",
                quote: "«В шахматах борются не фигуры, а люди. Пойми слабость человека — и его позиция рухнет».",
                bio: [
                    {
                        title: "Ученый и мыслитель",
                        text: "Эмануил Ласкер родился в Пруссии. Он сочетал шахматную карьеру мирового уровня с фундаментальной наукой: получил степень доктора математических наук и публиковал труды по философии. Ласкер состоял в многолетней дружеской переписке с Альбертом Эйнштейном, с которым вел глубокие споры о законах физики."
                    },
                    {
                        title: "Психологический метод",
                        text: "Ласкер стал первым шахматистом, который применил глубокий психологический подход к игре. Он оценивал не только объективную силу ходов на доске, но и личные качества соперника. Против агрессивных игроков он играл сдержанно, лишая их простора, а методичных теоретиков втягивал в хаос и неопределенность, провоцируя их на ошибки."
                    },
                    {
                        title: "Эпоха великого правления",
                        text: "Ласкер удерживал шахматную корону 27 лет подряд — это абсолютный рекорд, не побитый по сей день. Его фантастическая выносливость, умение защищать безнадежные позиции и совершать переломы в тяжелейших партиях сделали его одной из ключевых фигур в истории интеллектуального спорта."
                    }
                ],
                stats: [
                    { name: "Психология и гибкость", val: 100 },
                    { name: "Стрессоустойчивость", val: 100 },
                    { name: "Комбинационный удар", val: 88 },
                    { name: "Позиционная строгость", val: 72 }
                ],
                skillName: "Психологический гамбит",
                skillDesc: "Создает напряжение на доске, вынуждая соперника сомневаться и совершать грубые ошибки.",
                puzzle: {
                    title: "Амстердам, 1889 год",
                    desc: "Король противника укрыт за пешечной цепью. Каким ходом Ласкер начал сокрушительный прорыв?",
                    options: [
                        { text: "Слон берет h7+! Жертва слона", correct: true, comment: "Верно. Ласкер пожертвовал обоих слонов и поставил мат. Этот маневр вошел во все учебники." },
                        { text: "Спокойная короткая рокировка", correct: false, comment: "Слишком медленно. Противник успеет надежно укрепить позицию." },
                        { text: "Движение крайней пешки", correct: false, comment: "Неэффективно. Атака захлебнется без прямого вскрытия линий." }
                    ]
                }
            },
            2: {
                name: "Хосе Рауль Капабланка",
                title: "III Чемпион мира по шахматам (1921—1927)",
                color: "#f1c40f",
                quote: "«Хороший игрок всегда везуч. Ошибается тот, кто играет против меня».",
                bio: [
                    {
                        title: "Врожденный гений Гаваны",
                        text: "Хосе Рауль Капабланка родился на Кубе. Он проявил уникальные способности вундеркинда: освоил шахматные правила в возрасте четырех лет, лишь наблюдая за игрой отца со стороны, и обыграл его в первой же партии. В двенадцать лет Капабланка уже победил чемпиона своей страны в официальном матче."
                    },
                    {
                        title: "Шахматная машина и интуиция",
                        text: "Капабланка играл с непостижимой легкостью, почти не расходуя время на обдумывание ходов. За невероятную точность расчета и безупречную технику его называли шахматным автоматом. На пике карьеры он установил уникальный рекорд: за восемь лет подряд (с 1916 по 1924 год) он не потерпел ни одного поражения в турнирных партиях."
                    },
                    {
                        title: "Дипломат и популяризатор",
                        text: "Обладая утонченными манерами и безупречным стилем, Капабланка долгие годы служил дипломатом Кубы. Он превратил шахматы в светское искусство и доказал, что высшее мастерство достигается не заучиванием вариантов, а кристальной ясностью мышления и пониманием гармонии позиции."
                    }
                ],
                stats: [
                    { name: "Интуиция и гармония", val: 100 },
                    { name: "Скорость мысли", val: 98 },
                    { name: "Техника эндшпиля", val: 100 },
                    { name: "Стрессоустойчивость", val: 78 }
                ],
                skillName: "Кристальный эндшпиль",
                skillDesc: "Безошибочно трансформирует минимальное позиционное преимущество в чистую победу.",
                puzzle: {
                    title: "Москва, 1914 год",
                    desc: "Капабланка играет черными. Найдите ход высокой точности, вынудивший белых немедленно признать поражение.",
                    options: [
                        { text: "Защита пешки ладьей", correct: false, comment: "Пассивный ход. Капабланка всегда стремился к чистой динамике." },
                        { text: "Ферзь b2! Вторжение ферзя", correct: true, comment: "Верно. Ферзь атакует ключевые фигуры. Первая горизонталь белых оказывается беззащитна." },
                        { text: "Размен тяжелых фигур", correct: false, comment: "Приводит к нейтральному эндшпилю без явного преимущества." }
                    ]
                }
            }
        };

        let currentHeroId = null;
        let isMuted = true;
        let lostTimer = null;

        const hint = document.getElementById("scanner-hint");
        const dock = document.getElementById("interactive-dock");
        const soundBtn = document.getElementById("sound-toggle");
        const modal = document.getElementById("modal-container");
        const modalContent = document.getElementById("modal-content");

        [0, 1, 2].forEach(id => {
            const targetEl = document.getElementById(`target-${id}`);
            const videoEl = document.getElementById(`vid-${id}`);

            targetEl.addEventListener("targetFound", () => {
                if (lostTimer) clearTimeout(lostTimer);
                
                currentHeroId = id;
                applyHeroTheme(HEROES[id].color);

                hint.classList.add("hidden");
                dock.style.display = "flex";
                soundBtn.style.display = "flex";

                videoEl.muted = isMuted;
                videoEl.play().catch(() => {});
            });

            targetEl.addEventListener("targetLost", () => {
                lostTimer = setTimeout(() => {
                    videoEl.pause();
                    dock.style.display = "none";
                    soundBtn.style.display = "none";
                    hint.classList.remove("hidden");
                    closeModal();
                }, 1200);
            });
        });

        function applyHeroTheme(color) {
            document.documentElement.style.setProperty('--accent-color', color);
            soundBtn.style.borderColor = color;
        }

        soundBtn.addEventListener("click", () => {
            if (currentHeroId === null) return;
            const vid = document.getElementById(`vid-${currentHeroId}`);
            isMuted = !isMuted;
            vid.muted = isMuted;
            soundBtn.innerText = isMuted ? "ЗВУК: ВЫКЛ" : "ЗВУК: ВКЛ";
        });

        function openModal(type) {
            if (currentHeroId === null) return;
            const hero = HEROES[currentHeroId];

            if (type === 'bio') {
                modalContent.innerHTML = `
                    <div class="modal-title">${hero.name}</div>
                    <div class="modal-subtitle">${hero.title}</div>
                    <div class="modal-quote">${hero.quote}</div>
                    ${hero.bio.map(sec => `
                        <div class="bio-section-title">${sec.title}</div>
                        <div class="bio-paragraph">${sec.text}</div>
                    `).join('')}
                `;
            } else if (type === 'puzzle') {
                const p = hero.puzzle;
                modalContent.innerHTML = `
                    <div class="modal-title">Шахматная задача</div>
                    <div class="modal-subtitle">${p.title}</div>
                    <div style="font-size: 13px; color: #ccc; line-height: 1.45; margin-bottom: 14px;">${p.desc}</div>
                    
                    <div id="puzzle-feedback" style="display:none; font-size: 12px; line-height: 1.4; margin-bottom: 12px; padding: 10px; border-radius: 6px;"></div>

                    <div>
                        ${p.options.map((opt, i) => `
                            <button class="puzzle-option-btn" onclick="checkAnswer(${i})">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (type === 'stats') {
                modalContent.innerHTML = `
                    <div class="modal-title">Характеристики</div>
                    <div class="modal-subtitle">${hero.name}</div>
                    ${hero.stats.map(s => `
                        <div class="stat-row">
                            <div class="stat-header"><span>${s.name}</span><span>${s.val}%</span></div>
                            <div class="stat-track"><div class="stat-fill" style="width: ${s.val}%"></div></div>
                        </div>
                    `).join('')}
                    <div class="skill-box">
                        <div style="font-size: 11px; color: var(--accent-color); font-weight: 700; text-transform: uppercase;">Ключевой навык:</div>
                        <div style="font-size: 13px; font-weight: bold; margin-top: 2px;">${hero.skillName}</div>
                        <div style="font-size: 12px; color: #aaa; margin-top: 4px; line-height: 1.4;">${hero.skillDesc}</div>
                    </div>
                `;
            }

            modal.classList.add("active");
        }

        function closeModal() {
            modal.classList.remove("active");
        }

        function checkAnswer(index) {
            const opt = HEROES[currentHeroId].puzzle.options[index];
            const fb = document.getElementById("puzzle-feedback");
            fb.style.display = "block";

            if (opt.correct) {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                fb.style.background = "rgba(46, 204, 113, 0.2)";
                fb.style.color = "#2ecc71";
                fb.style.border = "1px solid #2ecc71";
                fb.innerHTML = opt.comment;
            } else {
                if (navigator.vibrate) navigator.vibrate(200);
                fb.style.background = "rgba(231, 76, 60, 0.2)";
                fb.style.color = "#e74c3c";
                fb.style.border = "1px solid #e74c3c";
                fb.innerHTML = opt.comment;
            }
        }
    </script>
</body>
</html>
