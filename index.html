<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тактикус Финч — Битва Чемпионов</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }

        /* Экран подсказки сканирования */
        #hint-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #00ffcc; z-index: 100; pointer-events: none; text-align: center; padding: 20px;
            transition: opacity 0.3s;
        }
        #hint-overlay.hidden { opacity: 0; }
        .spinner {
            border: 4px solid rgba(0, 255, 204, 0.2); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00ffcc;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Кнопка включения звука для соло-видео */
        #sound-btn {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); border: 1.5px solid #00ffcc; color: #fff;
            padding: 10px 22px; border-radius: 30px; font-size: 14px;
            display: none; align-items: center; gap: 8px; z-index: 150; cursor: pointer;
        }

        /* HUD БИТВЫ (Полоски HP файтинга) */
        #battle-hud {
            display: none; position: absolute; top: 15px; left: 10px; right: 10px;
            z-index: 120; pointer-events: none;
        }
        .hp-container { display: flex; justify-content: space-between; align-items: center; }
        .fighter-box { width: 44%; }
        .fighter-name { color: #fff; font-size: 13px; font-weight: bold; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
        .hp-bar-bg { width: 100%; height: 16px; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 8px; overflow: hidden; }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }
        #hp-steinitz { background: linear-gradient(90deg, #00ffcc, #00aa88); }
        #hp-lasker { background: linear-gradient(90deg, #ff0077, #9b59b6); }

        #battle-log {
            text-align: center; color: #ffeb3b; font-weight: bold; font-size: 14px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9); margin-top: 8px;
        }

        /* Кнопки управления боем */
        #action-controls {
            display: none; position: absolute; bottom: 20px; left: 15px; right: 15px;
            justify-content: center; gap: 8px; z-index: 150;
        }
        .btn-action {
            flex: 1; padding: 12px 6px; border-radius: 12px; border: none;
            font-size: 12px; font-weight: bold; color: #fff; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .btn-atk { background: #e74c3c; }
        .btn-def { background: #3498db; }
        .btn-skill { background: #9b59b6; }
    </style>
</head>
<body>

    <div id="hint-overlay">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: bold;">Наведите камеру на визитку</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 8px;">1 карта = видео | 2 карты рядом = битва</div>
    </div>

    <button id="sound-btn">🔊 Включить звук</button>

    <!-- Боевой интерфейс -->
    <div id="battle-hud">
        <div class="hp-container">
            <div class="fighter-box">
                <div class="fighter-name">В. Стейниц</div>
                <div class="hp-bar-bg"><div id="hp-steinitz" class="hp-bar-fill"></div></div>
            </div>
            <div style="color: #fff; font-weight: 900; font-size: 18px;">VS</div>
            <div class="fighter-box" style="text-align: right;">
                <div class="fighter-name">Э. Ласкер</div>
                <div class="hp-bar-bg"><div id="hp-lasker" class="hp-bar-fill"></div></div>
            </div>
        </div>
        <div id="battle-log">Дуэль началась! Ваш ход (Стейниц):</div>
    </div>

    <!-- Кнопки ударов -->
    <div id="action-controls">
        <button class="btn-action btn-atk" onclick="playerMove('attack')">⚔️ Атака</button>
        <button class="btn-action btn-def" onclick="playerMove('defense')">🛡️ Защита</button>
        <button class="btn-action btn-skill" onclick="playerMove('skill')">✨ Блокада</button>
    </div>

    <!-- Сцена MindAR: maxTrack: 2 обязательно! -->
    <a-scene 
        mindar-image="imageTargetSrc: ./cards.mind; maxTrack: 2; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 8;" 
        color-space="sRGB" renderer="colorManagement: true" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets timeout="4000">
            <video id="vid-0" src="./steinitz.mp4" preload="metadata" loop="true" playsinline webkit-playsinline muted></video>
            <video id="vid-1" src="./lasker.mp4" preload="metadata" loop="true" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- КАРТОЧКА 0: СТЕЙНИЦ -->
        <a-entity id="target-0" mindar-image-target="targetIndex: 0">
            <!-- Видео для одиночного просмотра -->
            <a-video id="mesh-video-0" src="#vid-0" width="1" height="1.54" position="0 0 0"></a-video>
            <!-- Боевая аура и урон -->
            <a-ring id="ring-0" visible="false" color="#00ffcc" radius-inner="0.6" radius-outer="0.68" rotation="-90 0 0"></a-ring>
            <a-text id="dmg-0" value="" align="center" position="0 0.8 0" scale="1.5 1.5 1.5" color="#ff4444"></a-text>
        </a-entity>

        <!-- КАРТОЧКА 1: ЛАСКЕР -->
        <a-entity id="target-1" mindar-image-target="targetIndex: 1">
            <!-- Видео для одиночного просмотра -->
            <a-video id="mesh-video-1" src="#vid-1" width="1" height="1.54" position="0 0 0"></a-video>
            <!-- Боевая аура и урон -->
            <a-ring id="ring-1" visible="false" color="#ff0077" radius-inner="0.6" radius-outer="0.68" rotation="-90 0 0"></a-ring>
            <a-text id="dmg-1" value="" align="center" position="0 0.8 0" scale="1.5 1.5 1.5" color="#ff4444"></a-text>
        </a-entity>

    </a-scene>

    <script>
        // Статистика чемпионов
        let steinitz = { hp: 100, maxHp: 100, atk: 22, def: 18, isDef: false, isBlocking: false };
        let lasker = { hp: 100, maxHp: 100, atk: 26, def: 12, isDef: false };

        const visibleTargets = new Set();
        const hint = document.getElementById("hint-overlay");
        const soundBtn = document.getElementById("sound-btn");
        const battleHud = document.getElementById("battle-hud");
        const actionControls = document.getElementById("action-controls");
        const battleLog = document.getElementById("battle-log");

        const vids = [document.getElementById("vid-0"), document.getElementById("vid-1")];
        const meshes = [document.getElementById("mesh-video-0"), document.getElementById("mesh-video-1")];
        const rings = [document.getElementById("ring-0"), document.getElementById("ring-1")];

        // Слушатели событий распознавания
        [0, 1].forEach(index => {
            const target = document.getElementById(`target-${index}`);
            target.addEventListener("targetFound", () => {
                visibleTargets.add(index);
                handleStateChange();
            });
            target.addEventListener("targetLost", () => {
                visibleTargets.delete(index);
                handleStateChange();
            });
        });

        // Диспетчер режимов: Соло или Дуэль
        function handleStateChange() {
            if (visibleTargets.size === 0) {
                // Ничего не видно
                hint.classList.remove("hidden");
                soundBtn.style.display = "none";
                battleHud.style.display = "none";
                actionControls.style.display = "none";
                vids.forEach(v => v.pause());
            } 
            else if (visibleTargets.size === 1) {
                // СОЛО-РЕЖИМ: играет видео найденного чемпиона
                hint.classList.add("hidden");
                battleHud.style.display = "none";
                actionControls.style.display = "none";
                soundBtn.style.display = "flex";

                rings.forEach(r => r.setAttribute("visible", "false"));
                meshes.forEach(m => m.setAttribute("visible", "true"));

                const activeIndex = [...visibleTargets][0];
                const inactiveIndex = activeIndex === 0 ? 1 : 0;

                vids[inactiveIndex].pause();
                vids[activeIndex].play().catch(() => {});
            } 
            else if (visibleTargets.size >= 2) {
                // БОЕВОЙ РЕЖИМ: обе визитки на столе!
                hint.classList.add("hidden");
                soundBtn.style.display = "none";
                vids.forEach(v => v.pause()); // глушим видео

                // Прячем видео, включаем неоновые кольца дуэли
                meshes.forEach(m => m.setAttribute("visible", "false"));
                rings.forEach(r => r.setAttribute("visible", "true"));

                battleHud.style.display = "block";
                actionControls.style.display = "flex";
            }
        }

        // Включение/выключение звука
        soundBtn.addEventListener("click", () => {
            const activeIndex = [...visibleTargets][0];
            if (activeIndex !== undefined) {
                const vid = vids[activeIndex];
                vid.muted = !vid.muted;
                soundBtn.innerHTML = vid.muted ? "🔊 Включить звук" : "🔇 Выключить звук";
            }
        });

        // 3D-анимация вылетающих цифр урона над визиткой
        function showDamage(targetIdx, text, color = "#ff4444") {
            const el = document.getElementById(`dmg-${targetIdx}`);
            el.setAttribute("value", text);
            el.setAttribute("color", color);
            el.setAttribute("position", "0 0.8 0");
            
            let y = 0.8;
            const anim = setInterval(() => {
                y += 0.02;
                el.setAttribute("position", `0 ${y} 0`);
            }, 30);

            setTimeout(() => {
                clearInterval(anim);
                el.setAttribute("value", "");
            }, 1200);
        }

        // Логика дуэли
        function playerMove(action) {
            steinitz.isDef = false;
            steinitz.isBlocking = false;

            if (action === 'attack') {
                let dmg = Math.max(8, steinitz.atk - (lasker.isDef ? lasker.def : 0));
                lasker.hp = Math.max(0, lasker.hp - dmg);
                battleLog.innerText = `Стейниц атакует: -${dmg} HP!`;
                showDamage(1, `-${dmg}`);
            } else if (action === 'defense') {
                steinitz.isDef = true;
                battleLog.innerText = `Стейниц выстроил пешечный вал!`;
                showDamage(0, "+DEF", "#3498db");
            } else if (action === 'skill') {
                steinitz.isBlocking = true;
                battleLog.innerText = `Стейниц: «Позиционная блокада»!`;
                showDamage(0, "БЛОКАДА", "#9b59b6");
            }

            updateBars();
            if (checkDuelEnd()) return;

            actionControls.style.pointerEvents = "none";
            setTimeout(() => {
                enemyTurn();
                updateBars();
                checkDuelEnd();
                actionControls.style.pointerEvents = "auto";
            }, 1100);
        }

        function enemyTurn() {
            lasker.isDef = false;
            const moves = ['attack', 'defense', 'skill'];
            const move = moves[Math.floor(Math.random() * moves.length)];

            if (steinitz.isBlocking) {
                lasker.hp = Math.max(0, lasker.hp - 15);
                battleLog.innerText = "Ласкер попал в блокаду: -15 контратаки!";
                showDamage(1, "-15 (Контр)", "#9b59b6");
                return;
            }

            if (move === 'attack') {
                let dmg = Math.max(8, lasker.atk - (steinitz.isDef ? steinitz.def : 0));
                steinitz.hp = Math.max(0, steinitz.hp - dmg);
                battleLog.innerText = `Ласкер наносит удар: -${dmg} HP!`;
                showDamage(0, `-${dmg}`);
            } else if (move === 'defense') {
                lasker.isDef = true;
                battleLog.innerText = `Ласкер уходит в защиту!`;
                showDamage(1, "+DEF", "#3498db");
            } else if (move === 'skill') {
                steinitz.hp = Math.max(0, steinitz.hp - 35);
                battleLog.innerText = `💥 Ласкер: «Психологический гамбит» (-35 чистый урон)!`;
                showDamage(0, "-35 КРИТ!", "#ff0077");
            }
        }

        function updateBars() {
            document.getElementById("hp-steinitz").style.width = `${(steinitz.hp / steinitz.maxHp) * 100}%`;
            document.getElementById("hp-lasker").style.width = `${(lasker.hp / lasker.maxHp) * 100}%`;
        }

        function checkDuelEnd() {
            if (lasker.hp <= 0) {
                battleLog.innerText = "🏆 Стейниц одержал победу и защитил титул!";
                actionControls.style.display = "none";
                return true;
            }
            if (steinitz.hp <= 0) {
                battleLog.innerText = "👑 Ласкер победил! Шахматная корона переходит к нему!";
                actionControls.style.display = "none";
                return true;
            }
            return false;
        }
    </script>
</body>
</html>
