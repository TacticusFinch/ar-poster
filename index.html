<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тактикус Финч — Чемпионы мира по шахматам</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-aframe.prod.js"></script>

<style>
:root {
  --accent-color: #00ffcc;
  --accent-glow: rgba(0, 255, 204, 0.4);
}

body {
  margin: 0;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  background-color: #000;
}

/* Прелоадер */
#scanner-hint {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(10, 15, 24, 0.35) 0%, rgba(0,0,0,0.55) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--accent-color);
  z-index: 100;
  text-align: center;
  padding: 24px;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
#scanner-hint.hidden { opacity: 0; }

/* Контейнер прицела */
.ar-reticle {
  position: relative;
  width: 72vw;
  max-width: 320px;
  aspect-ratio: 1 / 1.54;
  border: 1px solid rgba(0, 255, 204, 0.15);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
  overflow: hidden;
  box-shadow: inset 0 0 35px rgba(0, 255, 204, 0.06);
}

/* Уголки */
.reticle-corner {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: var(--accent-color);
  border-style: solid;
  border-width: 0;
  filter: drop-shadow(0 0 8px var(--accent-color));
}
.reticle-corner.top-left { top: 10px; left: 10px; border-top-width: 3.5px; border-left-width: 3.5px; border-top-left-radius: 8px; }
.reticle-corner.top-right { top: 10px; right: 10px; border-top-width: 3.5px; border-right-width: 3.5px; border-top-right-radius: 8px; }
.reticle-corner.bottom-left { bottom: 10px; left: 10px; border-bottom-width: 3.5px; border-left-width: 3.5px; border-bottom-left-radius: 8px; }
.reticle-corner.bottom-right { bottom: 10px; right: 10px; border-bottom-width: 3.5px; border-right-width: 3.5px; border-bottom-right-radius: 8px; }

/* Лазер */
.laser-beam {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--accent-color) 50%, transparent 100%);
  box-shadow: 0 0 15px var(--accent-color), 0 0 30px var(--accent-color);
  animation: scanLaser 2.2s ease-in-out infinite alternate;
}
@keyframes scanLaser {
  0% { transform: translateY(10px); opacity: 0.3; }
  50% { opacity: 1; }
  100% { transform: translateY(300px); opacity: 0.3; }
}

/* Вращающиеся кольца */
.hud-circle { position: absolute; border-radius: 50%; box-sizing: border-box; }
.ring-outer {
  width: 110px; height: 110px;
  border: 2px dashed var(--accent-color);
  opacity: 0.7;
  animation: rotateCW 8s linear infinite;
  filter: drop-shadow(0 0 8px var(--accent-glow));
}
.ring-inner {
  width: 80px; height: 80px;
  border: 3px solid transparent;
  border-top: 3px solid var(--accent-color);
  border-bottom: 3px solid var(--accent-color);
  animation: rotateCCW 2.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
}
@keyframes rotateCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes rotateCCW { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

/* Шахматный символ */
.hud-chess-core {
  font-size: 38px;
  color: var(--accent-color);
  text-shadow: 0 0 15px var(--accent-color), 0 0 25px var(--accent-glow);
  animation: pulseCore 1.6s ease-in-out infinite;
  z-index: 2;
}
@keyframes pulseCore {
  0%, 100% { transform: scale(0.92); opacity: 0.75; }
  50% { transform: scale(1.08); opacity: 1; }
}

.scanner-status { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.status-badge {
  font-size: 9px; font-weight: 800; letter-spacing: 1.5px;
  padding: 3px 8px; border-radius: 4px;
  background: rgba(0, 255, 204, 0.12);
  border: 1px solid var(--accent-color);
  color: var(--accent-color);
  margin-bottom: 4px;
}
.status-title { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #fff; }
.status-sub { font-size: 12px; color: #7a8b9e; }

  /* Прогресс загрузки AR */
.load-progress-box {
  width: 220px;
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.load-bar-track {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid rgba(0, 255, 204, 0.2);
}
.load-bar-fill {
  width: 0%;
  height: 100%;
  background: var(--accent-color);
  box-shadow: 0 0 10px var(--accent-color);
  transition: width 0.2s ease;
}
.load-subtext {
  font-size: 10px;
  color: #8a99ad;
  text-align: center;
  line-height: 1.3;
}
  
/* HUD и кнопки */
.top-hud {
  position: absolute; top: 16px; left: 16px; right: 16px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 120; pointer-events: none;
}
.hud-btn {
  pointer-events: auto;
  background: rgba(12, 16, 26, 0.75);
  border: 1px solid var(--accent-color);
  color: #fff; border-radius: 12px; padding: 8px 14px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  text-transform: uppercase; text-decoration: none;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px var(--accent-glow);
  cursor: pointer; transition: transform 0.15s;
}
.hud-btn:active { transform: scale(0.95); }
#bot-link-btn { border-color: #00e5ff; }

#interactive-dock {
  position: absolute; bottom: 24px; left: 14px; right: 14px;
  display: none; justify-content: space-between; gap: 10px; z-index: 110;
  animation: dockRise 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes dockRise {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.dock-btn {
  flex: 1; padding: 12px 6px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(25, 32, 48, 0.85) 0%, rgba(10, 14, 22, 0.95) 100%);
  border: 1.5px solid var(--accent-color);
  color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
  text-transform: uppercase; backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
  cursor: pointer; text-align: center; display: flex; flex-direction: column;
  align-items: center; gap: 4px; transition: all 0.2s ease;
}
.dock-btn:active {
  transform: scale(0.92);
  box-shadow: 0 2px 8px var(--accent-glow);
  background: var(--accent-color); color: #000;
}

/* Модальные окна */
.modal-overlay {
  position: absolute; inset: 0; background: rgba(4, 6, 12, 0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease; padding: 16px; box-sizing: border-box;
  backdrop-filter: blur(8px);
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-card {
  background: linear-gradient(160deg, #121824 0%, #080b11 100%);
  border: 1px solid var(--accent-color); border-radius: 18px;
  width: 100%; max-width: 420px; padding: 22px; color: #fff;
  position: relative; box-shadow: 0 0 35px var(--accent-glow);
  max-height: 85vh; overflow-y: auto; box-sizing: border-box;
}
.modal-close {
  position: absolute; top: 14px; right: 14px;
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
  color: #aaa; font-size: 11px; font-weight: 700; text-transform: uppercase;
  border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
.modal-close:active { background: rgba(255, 255, 255, 0.2); color: #fff; }
.modal-title { font-size: 18px; font-weight: 800; color: var(--accent-color); margin-bottom: 4px; padding-right: 65px; }
.modal-subtitle { font-size: 11px; color: #8a99ad; text-transform: uppercase; margin-bottom: 14px; }
.bio-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--accent-color); margin-top: 14px; margin-bottom: 4px; }
.bio-paragraph { font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 8px; text-align: justify; }
.modal-quote {
  font-style: italic; color: #ddd; font-size: 12px; line-height: 1.45;
  border-left: 3px solid var(--accent-color); padding: 8px 12px; margin: 12px 0;
  background: rgba(255, 255, 255, 0.03); border-radius: 0 8px 8px 0;
}
.diagram-container { width: 100%; margin: 12px 0; display: flex; justify-content: center; }
.diagram-img {
  max-width: 250px; width: 100%; height: auto;
  border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
  background-color: #1a1e28; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.difficulty-badge {
  display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase;
  padding: 4px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.08);
  color: var(--accent-color); margin-bottom: 8px;
}
.puzzle-option-btn {
  width: 100%; text-align: left; padding: 12px; font-size: 12px; margin-bottom: 8px;
  border-radius: 10px; background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; cursor: pointer; box-sizing: border-box;
}
.puzzle-option-btn:active { background: rgba(255, 255, 255, 0.15); border-color: var(--accent-color); }
.stat-row { margin-bottom: 12px; }
.stat-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #ccc; }
.stat-track { height: 7px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
.stat-fill { height: 100%; background: var(--accent-color); box-shadow: 0 0 8px var(--accent-glow); border-radius: 4px; }
.skill-box { margin-top: 16px; padding: 14px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.08); }
.external-promo-box { margin-top: 15px; padding: 12px; background: rgba(255, 255, 255, 0.04); border-radius: 10px; border: 1px dashed rgba(255, 255, 255, 0.15); text-align: center; }
.action-link-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 8px; padding: 11px 16px; width: 100%; box-sizing: border-box;
  border-radius: 10px; background: var(--accent-color); color: #000;
  font-size: 11px; font-weight: 800; text-decoration: none; text-transform: uppercase;
  letter-spacing: 0.4px; box-shadow: 0 4px 12px var(--accent-glow); cursor: pointer;
}
.action-link-btn:active { transform: scale(0.97); }
.action-link-btn.secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; box-shadow: none; }

/* Hotseat Арена */
#hotseat-arena {
  position: absolute; inset: 0; background: #080c14; z-index: 250;
  display: none; flex-direction: column; overflow: hidden; user-select: none;
}
#hotseat-arena.active { display: flex; }
.hs-zone { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 12px; box-sizing: border-box; position: relative; }
.hs-zone.top-player { transform: rotate(180deg); border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
.hs-divider {
  height: 32px; background: #0e1422;
  border-top: 1px solid rgba(255, 255, 255, 0.15); border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  display: flex; align-items: center; justify-content: space-between; padding: 0 14px; z-index: 10;
}
.hs-round-badge { font-size: 11px; font-weight: 800; color: #ff0055; letter-spacing: 1px; }
.hs-exit-btn { background: rgba(255, 50, 50, 0.15); border: 1px solid #ff4d6d; color: #ff4d6d; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; cursor: pointer; }
.hs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
.hs-hero-name { font-size: 11px; font-weight: 800; text-transform: uppercase; }
.hs-hp-val { font-size: 11px; font-weight: 800; }
.hs-hp-track { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.hs-hp-fill { height: 100%; transition: width 0.3s ease; }
.hs-content-row { flex: 1; display: flex; align-items: center; gap: 10px; margin: 4px 0; min-height: 0; }
.hs-board-img {
  height: 100%; max-height: 165px; aspect-ratio: 1 / 1; object-fit: contain;
  border-radius: 8px; border: 1.5px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8); background: #111622;
}
.hs-interactive-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.hs-prompt-badge { font-size: 9px; font-weight: 800; color: #00ffcc; text-transform: uppercase; line-height: 1.2; }
.hs-options-list { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.hs-opt-btn {
  background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff; padding: 7px 8px; border-radius: 6px; font-size: 10px; font-weight: 700;
  cursor: pointer; text-align: left; line-height: 1.2;
}
.hs-opt-btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.25); }
.hs-feedback-toast {
  position: absolute; inset: 0; background: rgba(4, 6, 12, 0.95);
  display: none; align-items: center; justify-content: center; flex-direction: column;
  z-index: 20; text-align: center; padding: 20px;
}
.hs-feedback-toast.active { display: flex; }



  /* Кнопка паспорта в верхнем HUD */
#passport-btn {
  border-color: #f1c40f;
  color: #f1c40f;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(241, 196, 15, 0.3);
}

/* Компактная сетка на 4 колонки (идеально для 15 карт: 4+4+4+3) */
.passport-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 12px 0;
}

/* Карточка чемпиона */
.passport-slot {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 5px 3px 6px 3px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  transition: transform 0.15s ease, border-color 0.2s ease;
  position: relative;
  box-sizing: border-box;
}

.passport-slot.unlocked {
  background: #0f1420;
  border-color: rgba(255, 255, 255, 0.18);
}
.passport-slot.unlocked:active {
  transform: scale(0.96);
}

.passport-slot.locked {
  filter: grayscale(1);
  opacity: 0.28;
}

/* Фиксированный компактный размер под картинки 100x100px */
.passport-avatar-wrap {
  width: 56px;
  height: 56px;
  border-radius: 6px;
  overflow: hidden;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

/* Фото с аппаратным сглаживанием резкости */
.passport-avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  /* Заставляет браузер аккуратно интерполировать пиксели при уменьшении */
  image-rendering: -webkit-optimize-contrast;
  image-rendering: high-quality;
}

/* Имя чемпиона под иконкой */
.passport-hero-name {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: #ddd;
  line-height: 1.1;
  width: 100%;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Миниатюрная аккуратная галочка сданного теста */
.passport-badge-test {
  position: absolute;
  top: 3px;
  right: 3px;
  font-size: 7px;
  background: #2ecc71;
  color: #000;
  border-radius: 50%;
  width: 13px;
  height: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  z-index: 5;
  box-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

/* Замок для закрытых слотов */
.passport-lock-icon {
  font-size: 16px;
  opacity: 0.4;
}

.passport-monogram {
  font-size: 11px;
  font-weight: 800;
  color: #666;
}

/* Всплывающее уведомление о новой открытой карте */
#unlock-toast {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: linear-gradient(135deg, #1f2937, #111827);
  border: 1.5px solid #f1c40f;
  box-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
  color: #fff;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 800;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#unlock-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

  
</style>
</head>

<body>

<!-- Прелоадер -->
<div id="scanner-hint">
  <div class="ar-reticle">
    <div class="reticle-corner top-left"></div>
    <div class="reticle-corner top-right"></div>
    <div class="reticle-corner bottom-left"></div>
    <div class="reticle-corner bottom-right"></div>
    <div class="laser-beam"></div>
    <div class="hud-circle ring-outer"></div>
    <div class="hud-circle ring-inner"></div>
    <div class="hud-chess-core">♚</div>
  </div>

<!-- Уведомление об открытии карты -->
<div id="unlock-toast">
  <span>🏆</span>
  <span id="unlock-toast-text">НОВАЯ ЛЕГЕНДА В КОЛЛЕКЦИИ!</span>
</div>
  
  <div class="scanner-status">
    <div id="loading-badge" class="status-badge" style="border-color: #f1c40f; color: #f1c40f;">ЗАГРУЗКА БАЗЫ AR...</div>
    <div id="loading-title" class="status-title">ИНИЦИАЛИЗАЦИЯ 17 ГЕРОЕВ</div>
    
    <!-- Полоса прогресса и предупреждение -->
    <div id="load-progress-container" class="load-progress-box">
      <div class="load-bar-track">
        <div id="load-bar-fill" class="load-bar-fill"></div>
      </div>
      <div id="load-percent" style="font-size: 11px; font-weight: 800;">0%</div>
      <div class="load-subtext">Идет подготовка базы данных чемпионов.<br>Пожалуйста, не закрывайте страницу.</div>
    </div>

    <div id="ready-status-sub" class="status-sub" style="display: none; margin-top: 8px;">
      15 легенд готовы • Наведите камеру на карту
    </div>
  </div>
</div>

<!-- Верхний HUD -->
<div class="top-hud">
  <a id="bot-link-btn" class="hud-btn" href="https://max.ru/se14097294_bot" target="_blank">
    <span>🤖</span> Тактикус Финч
  </a>
  <!-- Кнопка Паспорта -->
  <button id="passport-btn" class="hud-btn" onclick="openPassportModal()">
    <span></span> Коллекция <span id="passport-counter">(0/15)</span>
  </button>
  <button id="sound-toggle" class="hud-btn" style="display: none;">
    <span>🔇</span> ЗВУК: ВЫКЛ
  </button>
</div>

<!-- Нижнее меню -->
<div id="interactive-dock">
  <button class="dock-btn" onclick="openModal('bio')"><span>Биография</span></button>
  <button class="dock-btn" onclick="openModal('test')"><span>Тест</span></button>
  <button class="dock-btn" onclick="openModal('stats')"><span>Характеристики</span></button>
  <button class="dock-btn" onclick="startHotseatDuel()" style="border-color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.4);">
    <span style="color: #ff0055;">Дуэль</span>
  </button>
</div>

<!-- Модальные окна -->
<div id="modal-container" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">Закрыть ✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- MindAR сцена -->
<a-scene
  mindar-image="maxTrack: 1; uiLoading: no; uiScanning: no; warmupTolerance: 1; missTolerance: 4; filterMinCF: 0.001; filterBeta: 0.01;"
  color-space="sRGB"
  renderer="colorManagement: true; precision: medium;"
  vr-mode-ui="enabled: false"

  <script>

// ================= ЗВУКОВОЙ ДВИЖОК WEB AUDIO API =================
class SoundController {
  constructor() {
    this.ctx = null;
    this.enabled = false;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    this.enabled = true;
  }

  toggle() {
    this.enabled = !this.enabled;
    if (this.enabled && (!this.ctx || this.ctx.state === 'suspended')) {
      this.init();
    }
    return this.enabled;
  }

  // 1. Стук деревянной шахматной фигуры
  playMove() {
    if (!this.enabled || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);

    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  // 2. Триумфальные фанфары
  playFanfare() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;

    const notes = [
      { freq: 261.63, time: 0.00, dur: 0.15 },
      { freq: 329.63, time: 0.12, dur: 0.15 },
      { freq: 392.00, time: 0.24, dur: 0.18 },
      { freq: 523.25, time: 0.38, dur: 0.40 },
      { freq: 659.25, time: 0.50, dur: 0.90 }
    ];

    notes.forEach(n => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n.freq, now + n.time);

      gain.gain.setValueAtTime(0.3, now + n.time);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.dur);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + n.time);
      osc.stop(now + n.time + n.dur);

      const chime = this.ctx.createOscillator();
      const chimeGain = this.ctx.createGain();
      chime.type = 'sine';
      chime.frequency.setValueAtTime(n.freq * 2, now + n.time);

      chimeGain.gain.setValueAtTime(0.12, now + n.time);
      chimeGain.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.dur);

      chime.connect(chimeGain);
      chimeGain.connect(this.ctx.destination);
      chime.start(now + n.time);
      chime.stop(now + n.time + n.dur);
    });
  }

  // 3. Захват карточки камерой (AR Lock-on)
  playTargetFound() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;

    const createShutterNoise = (startTime, duration, gainVal, cutoffFreq) => {
      const bufferSize = Math.floor(this.ctx.sampleRate * duration);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(cutoffFreq, startTime);
      filter.Q.setValueAtTime(1.8, startTime);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(gainVal, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      noise.start(startTime);
      noise.stop(startTime + duration);
    };

    const click1 = this.ctx.createOscillator();
    const click1Gain = this.ctx.createGain();
    click1.type = 'triangle';
    click1.frequency.setValueAtTime(2400, now);
    click1.frequency.exponentialRampToValueAtTime(120, now + 0.025);

    click1Gain.gain.setValueAtTime(0.45, now);
    click1Gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

    click1.connect(click1Gain);
    click1Gain.connect(this.ctx.destination);
    click1.start(now);
    click1.stop(now + 0.025);

    createShutterNoise(now + 0.005, 0.04, 0.28, 4200);

    const t2 = now + 0.045;

    const click2 = this.ctx.createOscillator();
    const click2Gain = this.ctx.createGain();
    click2.type = 'triangle';
    click2.frequency.setValueAtTime(1800, t2);
    click2.frequency.exponentialRampToValueAtTime(90, t2 + 0.035);

    click2Gain.gain.setValueAtTime(0.5, t2);
    click2Gain.gain.exponentialRampToValueAtTime(0.001, t2 + 0.035);

    click2.connect(click2Gain);
    click2Gain.connect(this.ctx.destination);
    click2.start(t2);
    click2.stop(t2 + 0.035);

    const bodyThump = this.ctx.createOscillator();
    const bodyGain = this.ctx.createGain();
    bodyThump.type = 'sine';
    bodyThump.frequency.setValueAtTime(160, t2);
    bodyThump.frequency.exponentialRampToValueAtTime(45, t2 + 0.07);

    bodyGain.gain.setValueAtTime(0.4, t2);
    bodyGain.gain.exponentialRampToValueAtTime(0.001, t2 + 0.07);

    bodyThump.connect(bodyGain);
    bodyGain.connect(this.ctx.destination);
    bodyThump.start(t2);
    bodyThump.stop(t2 + 0.07);

    createShutterNoise(t2 + 0.01, 0.05, 0.22, 2800);
  }

  // 4. Правильный ход
  playCorrect() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.06);
      gain.gain.setValueAtTime(0.12, now + idx * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + idx * 0.06);
      osc.stop(now + idx * 0.06 + 0.3);
    });
  }

  // 5. Зевок / Ошибка
  playWrong() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.linearRampToValueAtTime(110, now + 0.25);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  }

  // 6. Шах и мат
  playCheckmate() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const freqs = [220, 277.18, 329.63, 440];
    freqs.forEach(f => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 1.2);
    });
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  const sceneEl = document.querySelector('a-scene');
  const barFill = document.getElementById('load-bar-fill');
  const percentText = document.getElementById('load-percent');
  const loadBox = document.getElementById('load-progress-container');
  const badge = document.getElementById('loading-badge');
  const title = document.getElementById('loading-title');
  const readySub = document.getElementById('ready-status-sub');

  const setStatus = (stepName, percent = null) => {
    console.log(`[AR Status]: ${stepName}`);
    percentText.innerText = stepName;
    if (percent !== null) barFill.style.width = percent + '%';
  };

  try {
    setStatus("Скачивание базы (.gz)...", 10);
    const response = await fetch('./cards.mind.gz');
    if (!response.ok) throw new Error(`HTTP ${response.status}: cards.mind.gz не найден`);

    const contentLength = +response.headers.get('Content-Length');
    const reader = response.body.getReader();
    let receivedLength = 0;
    let chunks = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      receivedLength += value.length;

      if (contentLength) {
        const percent = Math.min(85, Math.round((receivedLength / contentLength) * 85));
        const mb = (receivedLength / (1024 * 1024)).toFixed(1);
        const totalMb = (contentLength / (1024 * 1024)).toFixed(1);
        barFill.style.width = percent + '%';
        percentText.innerText = `Скачано: ${mb} из ${totalMb} МБ (${percent}%)`;
      }
    }

    setStatus("Распаковка Gzip...", 90);
    const compressedBlob = new Blob(chunks);
    const decompressedStream = compressedBlob.stream().pipeThrough(new DecompressionStream('gzip'));
    const mindBlob = await new Response(decompressedStream).blob();
    const mindBlobUrl = URL.createObjectURL(mindBlob);

    setStatus("Ожидание 3D сцены...", 95);
    // Ждем, пока сцена A-Frame закончит внутреннюю сборку
    if (!sceneEl.hasLoaded) {
      await new Promise(res => sceneEl.addEventListener('loaded', res, { once: true }));
    }

    setStatus("Запуск AR-сенсоров...", 98);

    // Передаем Blob URL в систему
    sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${mindBlobUrl}; maxTrack: 1; uiLoading: no; uiScanning: no; warmupTolerance: 1; missTolerance: 4; filterMinCF: 0.001; filterBeta: 0.01;`);

    // Запускаем систему с таймаутом безопасности
    const arSystem = sceneEl.systems["mindar-image-system"];
    if (!arSystem) {
      throw new Error("MindAR система не зарегистрирована в A-Frame");
    }

    // Запуск камеры с контролем зависания (таймаут 15 секунд)
    await Promise.race([
      arSystem.start(),
      new Promise((_, reject) => 
        setTimeout(() => reject(new Error("Превышено время ожидания камеры (Таймаут)")), 20000)
      )
    ]);

setStatus("Готово!", 100);

    // СРАЗУ переключаем интерфейс, так как система УЖЕ готова:
    setTimeout(() => {
      loadBox.style.display = "none";
      readySub.style.display = "block";
      badge.innerText = "AR СКАНЕР АКТИВЕН";
      badge.style.borderColor = "var(--accent-color)";
      badge.style.color = "var(--accent-color)";
      title.innerText = "НАВЕДИТЕ НА КАРТОЧКУ";
    }, 200);

  } catch (err) {
    console.error("Критический сбой инициализации:", err);
    badge.innerText = "ОШИБКА";
    badge.style.borderColor = "#ff4d6d";
    badge.style.color = "#ff4d6d";
    title.innerText = "СБОЙ ИНИЦИАЛИЗАЦИИ";
    percentText.innerText = err.message || "Неизвестная ошибка";
    barFill.style.background = "#ff4d6d";
  }

  sceneEl.addEventListener("arError", (ev) => {
    console.error("Событие arError:", ev);
    badge.innerText = "ОШИБКА КАМЕРЫ";
    badge.style.borderColor = "#ff4d6d";
    badge.style.color = "#ff4d6d";
    title.innerText = "ДОСТУП ЗАПРЕЩЕН";
    percentText.innerText = "Разрешите браузеру доступ к камере";
  });

  updatePassportCounter();
});

  const videoEl = document.getElementById(`vid-${id}`);

  targetEl.addEventListener("targetFound", () => {
    sfx.playTargetFound();

    dock.style.display = "flex";

      showChampionUI();
    }

    if (videoEl) {
      videoEl.muted = isMuted;
      videoEl.volume = 1.0;
      
      // Показываем видео только тогда, когда первый кадр уже готов к показу
      const showVideoFrame = () => {
        if (aVideo) aVideo.setAttribute('visible', 'true');
      };

      if (videoEl.readyState >= 2) {
        showVideoFrame();
      } else {
        videoEl.addEventListener('playing', showVideoFrame, { once: true });
      }

      videoEl.play().catch(() => {});
    }
  });

  targetEl.addEventListener("targetLost", () => {
    if (aVideo) {
      // Сразу прячем плоскость при потере карты из вида
      aVideo.setAttribute('visible', 'false');
    }

    if (videoEl) {
      videoEl.muted = true;
      videoEl.volume = 0;
      videoEl.pause();
    }
  });
});

function renderPuzzleQuestion() {
  const hero = HEROES[currentHeroId];
  const p = hero.puzzles[currentPuzzleIndex];

  // Перемешиваем варианты случайным образом при каждом показе
  if (!p._shuffledOptions) {
    p._shuffledOptions = [...p.options].sort(() => Math.random() - 0.5);
  }
  const currentOptions = p._shuffledOptions;

  const diagramHtml = p.image
    ? `<div class="diagram-container">
        <img class="diagram-img" src="${p.image}" alt="Шахматная диаграмма" onerror="this.style.display='none'">
       </div>`
    : '';

  modalContent.innerHTML = `
    <div class="modal-title">Экзамен чемпиона</div>
    <div class="modal-subtitle">${hero.name} — Вопрос ${currentPuzzleIndex + 1} из ${hero.puzzles.length}</div>

function checkAnswer(index) {
  const hero = HEROES[currentHeroId];
  const p = hero.puzzles[currentPuzzleIndex];
  
  // Берем вариант именно из перемешанного списка:
  const opt = (p._shuffledOptions || p.options)[index];
  
  const fb = document.getElementById("puzzle-feedback");
  const nextContainer = document.getElementById("puzzle-next-container");
  const optionsContainer = document.getElementById("puzzle-options");

  const buttons = optionsContainer.getElementsByTagName("button");
  for (let btn of buttons) {
    btn.disabled = true;
    btn.style.opacity = "0.6";
    btn.style.cursor = "default";
  }

  fb.style.display = "block";

  if (opt.correct) {
    sfx.playCorrect();
    testScore++;
    if (navigator.vibrate) navigator.vibrate([70, 50, 70]);
    fb.style.background = "rgba(46, 204, 113, 0.2)";
    fb.style.color = "#2ecc71";
    fb.style.border = "1px solid #2ecc71";
    fb.innerHTML = `<b>ВЕРНО!</b> ${opt.comment}`;
  } else {
    sfx.playWrong();
    if (navigator.vibrate) navigator.vibrate(180);
    fb.style.background = "rgba(231, 76, 60, 0.2)";
    fb.style.color = "#e74c3c";
    fb.style.border = "1px solid #e74c3c";
    fb.innerHTML = `<b>НЕВЕРНО.</b> ${opt.comment}`;
  }

  nextContainer.style.display = "block";
}

function fillDuelDeck() {
  duelState.deck = [
    ...duelState.p1Hero.puzzles,
    ...duelState.p2Hero.puzzles
  ].sort(() => Math.random() - 0.5);
}

function updateHpBars() {
  document.getElementById("p1-hp-num").innerText = `${duelState.p1Hp}%`;
  document.getElementById("p1-hp-bar").style.width = `${duelState.p1Hp}%`;
  document.getElementById("p2-hp-num").innerText = `${duelState.p2Hp}%`;
  document.getElementById("p2-hp-bar").style.width = `${duelState.p2Hp}%`;
}

function loadNextDuelRound() {
  if (duelState.p1Hp <= 0 || duelState.p2Hp <= 0) {
    endDuel();
    return;
  }

  duelState.roundLocked = false;
  duelState.roundIndex++;

  if (duelState.deck.length === 0) {
    fillDuelDeck();
  }
  const q = duelState.deck.pop();
  duelState.currentQuestion = q;

  document.getElementById("hs-round-info").innerText = `РАУНД ${duelState.roundIndex}`;

  const hasImage = !!q.image;

  ['p1', 'p2'].forEach(player => {
    const imgEl = document.getElementById(`${player}-board-img`);
    const promptEl = document.getElementById(`${player}-prompt`);
    const optContainer = document.getElementById(`${player}-options`);

    if (hasImage) {
      imgEl.src = q.image;
      imgEl.style.display = "block";
      promptEl.innerText = "🎯 НАЙДИТЕ ЛУЧШИЙ ХОД:";
      promptEl.style.color = "var(--accent-color)";
    } else {
      imgEl.style.display = "none";
      promptEl.innerText = q.desc;
      promptEl.style.color = "#eee";
    }

    optContainer.innerHTML = q.options.map((opt, i) => `
      <button class="hs-opt-btn" onclick="handleDuelTap('${player}', ${i})">
        ${opt.text}
      </button>
    `).join('');
  });
}

function handleDuelTap(player, optIndex) {
  if (duelState.roundLocked) return;
  duelState.roundLocked = true;

  const q = duelState.currentQuestion;
  const isCorrect = q.options[optIndex].correct;

  if (navigator.vibrate) navigator.vibrate(isCorrect ? 70 : 180);

  if (player === 'p1') {
    if (isCorrect) {
      sfx.playCorrect();
      duelState.p2Hp = Math.max(0, duelState.p2Hp - 25);
      flashPrompt('p1', '⚡ ТОЧНЫЙ ХОД! (-25%)', '#2ecc71');
      flashPrompt('p2', '💥 ПРОПУЩЕН УДАР! (-25%)', '#e74c3c');
    } else {
      sfx.playWrong();
      duelState.p1Hp = Math.max(0, duelState.p1Hp - 15);
      flashPrompt('p1', '❌ ЗЕВОК! ОШИБКА (-15%)', '#e74c3c');
      flashPrompt('p2', '🛡️ СОПЕРНИК ОШИБСЯ!', '#2ecc71');
    }
  } else {
    if (isCorrect) {
      duelState.p1Hp = Math.max(0, duelState.p1Hp - 25);
      flashPrompt('p2', '⚡ ТОЧНЫЙ ХОД! (-25%)', '#2ecc71');
      flashPrompt('p1', '💥 ПРОПУЩЕН УДАР! (-25%)', '#e74c3c');
    } else {
      duelState.p2Hp = Math.max(0, duelState.p2Hp - 15);
      flashPrompt('p2', '❌ ЗЕВОК! ОШИБКА (-15%)', '#e74c3c');
      flashPrompt('p1', '🛡️ СОПЕРНИК ОШИБСЯ!', '#2ecc71');
    }
  }

  updateHpBars();

  setTimeout(() => {
    loadNextDuelRound();
  }, 1200);
}

function flashPrompt(player, text, color) {
  const promptEl = document.getElementById(`${player}-prompt`);
  promptEl.innerHTML = `<span style="color: ${color}; font-size: 11px; font-weight: 900;">${text}</span>`;
}

function endDuel() {
  const goModal = document.getElementById("hs-gameover");
  const title = document.getElementById("hs-winner-title");
  const desc = document.getElementById("hs-winner-desc");
  let winner = null;

async function sendChatMessage() {
  const input = document.getElementById("ai-chat-input");
  const chatBox = document.getElementById("ai-chat-box");
  const text = input.value.trim();
  if (!text) return;

  const hero = HEROES[currentHeroId];
  input.value = "";
  sfx.playMove();

  // Хак для Safari/iOS: создаем инстанс плеера в момент пользовательского клика
  const heroAudio = new Audio();

  // Добавляем реплику пользователя и индикатор ожидания
  chatBox.innerHTML += `
    <div style="color: #fff; margin-top: 8px; text-align: right;">
      <span style="background: rgba(255, 255, 255, 0.1); padding: 5px 10px; border-radius: 8px; display: inline-block;">
        <b>Вы:</b> ${text}
      </span>
    </div>
    <div id="ai-thinking-indicator" style="color: #aaa; font-style: italic; margin-top: 8px;">
      ${hero.name} обдумывает ответ...
    </div>
  `;
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const systemPrompt = HERO_AI_PROMPTS[currentHeroId] || 
      `Ты — ${hero.name}. Ответь кратко, емко и в своем стиле шахматиста.`;

    const response = await fetch(AMVERA_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_prompt: systemPrompt,
        user_message: text,
        hero_id: currentHeroId !== null ? currentHeroId : 0
      })
    });

    if (!response.ok) throw new Error("Ошибка связи с сервером");

    const data = await response.json();
    const reply = data.reply;

    // Убираем индикатор ожидания
    const loader = document.getElementById("ai-thinking-indicator");
    if (loader) loader.remove();

    // Плашка времени (если сервер прислал benchmark)
    const timeBadge = data.benchmark?.total_sec 
      ? `<div style="font-size: 9px; color: #7a8b9e; margin-top: 2px;">⚡ Ответ готов за ${data.benchmark.total_sec} сек.</div>`
      : '';

    // Выводим ответ чемпиона
    chatBox.innerHTML += `
      <div style="color: ${hero.color}; margin-top: 10px;">
        <b>${hero.name}:</b> ${reply}
        ${timeBadge}
      </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;

    // Воспроизведение звука: если пришел студийный Дмитрий — играем его, иначе браузерный синтезатор
    if (data.audio) {
      heroAudio.src = data.audio;
      heroAudio.play().catch(err => {
        console.warn("Автовоспроизведение MP3 не удалось, включаем синтезатор:", err);
        speakHeroVoice(reply);
      });
    } else {
      speakHeroVoice(reply);
    }

  } catch (err) {
    const loader = document.getElementById("ai-thinking-indicator");
    if (loader) loader.remove();

    chatBox.innerHTML += `
      <div style="color: #ff4d6d; margin-top: 8px; font-size: 11px;">
        ⚠️ Не удалось связаться с сервером Amvera. Проверьте статус приложения в панели.
      </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

// Голосовой ввод через Web Speech API
let recognition = null;
function toggleSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Голосовой ввод не поддерживается вашим браузером. Пожалуйста, используйте текстовое поле.");
    return;
  }

  const micBtn = document.getElementById("ai-mic-btn");

  if (!recognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.interimResults = false;

    recognition.onstart = () => {
      micBtn.style.background = "#ff0055";
      micBtn.innerText = "🛑";
    };

    recognition.onresult = (e) => {
      const speechResult = e.results[0][0].transcript;
      document.getElementById("ai-chat-input").value = speechResult;
      sendChatMessage();
    };

    recognition.onend = () => {
      micBtn.style.background = "";
      micBtn.innerText = "🎙️";
      recognition = null;
    };

    recognition.onerror = () => {
      micBtn.style.background = "";
      micBtn.innerText = "🎙️";
      recognition = null;
    };

    recognition.start();
  } else {
    recognition.stop();
  }
}

// Озвучка ответа персонажа
function speakHeroVoice(text) {
  if (!('speechSynthesis' in window)) return;

  window.speechSynthesis.cancel(); // сбрасываем прошлую речь
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ru-RU";
  utter.rate = 1.0;

  // Получаем список доступных голосов в системе
  const voices = window.speechSynthesis.getVoices();
  
  // Ищем русскоязычные голоса
  const ruVoices = voices.filter(v => v.lang.includes("ru") || v.lang.includes("RU"));

  // Пытаемся найти мужской голос (популярные имена в Windows/Google/Apple)
  const maleVoice = ruVoices.find(v => 
    v.name.toLowerCase().includes("dmitry") || 
    v.name.toLowerCase().includes("pavel") || 
    v.name.toLowerCase().includes("yuri") || 
    v.name.toLowerCase().includes("male") ||
    v.name.toLowerCase().includes("man")
  );

  if (maleVoice) {
    utter.voice = maleVoice;
  } else if (ruVoices.length > 0) {
    // Если мужской не найден по имени, берем первый доступный русский
    utter.voice = ruVoices[0];
  }

  // Настройки тембра (Pitch) под характер
  if (currentHeroId === 6) {
    // Stockfish (низкий робо-бас)
    utter.pitch = 0.2;
    utter.rate = 1.1;
  } else if (currentHeroId === 10 || currentHeroId === 11) {
    // Молодые гроссмейстеры (Накамура, Гукеш)
    utter.pitch = 0.95;
    utter.rate = 1.1;
  } else {
    // Взрослые чемпионы (Таль, Ботвинник, Стейниц) — занижаем тон для солидности
    utter.pitch = 0.75; 
  }

  window.speechSynthesis.speak(utter);
}

// Браузеры загружают голоса асинхронно, поэтому нужно пнуть их инициализацию при старте:
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}


// ================= ЛОГИКА ПАСПОРТА ГРОССМЕЙСТЕРА =================

// Структура хранилища: { unlocked: [0, 1, ...], testsPassed: [0, ...] }
const PASSPORT_KEY = "tacticus_chess_passport_v1";

function getPassportData() {
  try {
    const data = localStorage.getItem(PASSPORT_KEY);
    return data ? JSON.parse(data) : { unlocked: [], testsPassed: [] };
  } catch(e) {
    return { unlocked: [], testsPassed: [] };
  }
}

function savePassportData(data) {
  try {
    localStorage.setItem(PASSPORT_KEY, JSON.stringify(data));
    updatePassportCounter();
  } catch(e) {}
}

// Обновление счетчика на кнопке в HUD
function updatePassportCounter() {
  const data = getPassportData();
  const counterEl = document.getElementById("passport-counter");
  if (counterEl) {
    const totalHeroes = Object.keys(HEROES).length;
    counterEl.innerText = `(${data.unlocked.length}/${totalHeroes})`;
    if (data.unlocked.length === totalHeroes) {
      counterEl.style.color = "#f1c40f";
    }
  }
}

// Регистрация нахождения новой карты при наведении камеры
function registerCardDiscovery(heroId) {
  if (heroId === null || heroId === undefined) return;
  const data = getPassportData();
  if (!data.unlocked.includes(heroId)) {
    data.unlocked.push(heroId);
    savePassportData(data);
    showUnlockToast(HEROES[heroId].name);
  }
}

// Регистрация успешной сдачи теста
function registerTestPassed(heroId) {
  if (heroId === null || heroId === undefined) return;
  const data = getPassportData();
  if (!data.testsPassed.includes(heroId)) {
    data.testsPassed.push(heroId);
    savePassportData(data);
  }
}

// Анимация всплывающего бейджа
function showUnlockToast(heroName) {
  const toast = document.getElementById("unlock-toast");
  const text = document.getElementById("unlock-toast-text");
  if (!toast || !text) return;

  text.innerText = `ОТКРЫТ: ${heroName.toUpperCase()}`;
  toast.classList.add("show");
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2600);
}

// Иконки шахматных фигур для слотов
const HERO_ICONS = ["♚", "♛", "♜", "♝", "♞", "♟", "🤖", "♚", "♛", "♝", "♞", "♟", "♜", "♚", "♛"];

// Открытие модального окна Паспорта
function openPassportModal() {
  sfx.playMove();
  const data = getPassportData();
  const total = Object.keys(HEROES).length;
  const progressPercent = Math.round((data.unlocked.length / total) * 100);
  const isComplete = data.unlocked.length === total;

  let gridHtml = '';
  for (let i = 0; i < total; i++) {
    const hero = HEROES[i];
    const isUnlocked = data.unlocked.includes(i);
    const testDone = data.testsPassed.includes(i);
    
    // Инициалы для запасного варианта (например, "В.С." или "М.Т.")
    const initials = hero.name.split(' ').map(n => n[0]).join('');

if (isUnlocked) {
      gridHtml += `
        <div class="passport-slot unlocked">
          ${testDone ? '<span class="passport-badge-test" title="Экзамен сдан">✓</span>' : ''}
          <div class="passport-avatar-wrap">
            ${hero.avatar ? `
              <img class="passport-avatar-img" src="${hero.avatar}" alt="${hero.name}" 
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <div class="passport-monogram" style="display:none;">${initials}</div>
            ` : `
              <div class="passport-monogram">${initials}</div>
            `}
          </div>
          <div class="passport-hero-name">${hero.name.split(' ').pop()}</div>
        </div>
      `;
    } else {
      // Закрытый слот
      gridHtml += `
        <div class="passport-slot locked">
          <div class="passport-avatar-wrap">
            <span class="passport-lock-icon">🔒</span>
          </div>
          <div class="passport-hero-name">№ ${i + 1}</div>
        </div>
      `;
    }
  }
  modalContent.innerHTML = `
    <div class="modal-title" style="color: #f1c40f;">Моя коллекция</div>
    <div class="modal-subtitle">Коллекция легенд шахматной школы</div>

    <!-- Прогресс сбора -->
    <div style="margin: 10px 0;">
      <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px; font-weight:700;">
        <span>Собрано легенд: ${data.unlocked.length} из ${total}</span>
        <span style="color:#f1c40f;">${progressPercent}%</span>
      </div>
      <div style="height:8px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden;">
        <div style="height:100%; width:${progressPercent}%; background:linear-gradient(90deg, #f1c40f, #00ffcc); transition: width 0.4s ease;"></div>
      </div>
    </div>

    <!-- Сетка карточек -->
    <div class="passport-grid">
      ${gridHtml}
    </div>

    ${isComplete ? `
      <!-- Блок триумфа и генерации диплома -->
      <div style="margin-top: 14px; padding: 14px; background: rgba(241, 196, 15, 0.1); border: 1.5px solid #f1c40f; border-radius: 12px; text-align: center;">
        <div style="font-size: 13px; font-weight: 800; color: #f1c40f;">ВСЯ КОЛЛЕКЦИЯ СОБРАНА!</div>
        <div style="font-size: 11px; color: #ccc; margin: 4px 0 10px 0;">Вы разблокировали почетный диплом школы «Тактикус Финч»</div>
        
        <input id="diploma-name-input" type="text" placeholder="Введите ваше имя и фамилию" 
          style="width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-size: 12px; text-align: center; margin-bottom: 8px;">

        <button class="action-link-btn" onclick="generateDiplomaCanvas()" style="background: #f1c40f; color: #000;">
          🎓 Скачать именной диплом
        </button>
      </div>
    ` : `
      <div style="font-size: 11px; color: #8a99ad; text-align: center; margin-top: 10px; line-height: 1.4;">
        Наводите камеру на физические карточки, чтобы открыть все 15 легенд и получить диплом гроссмейстера!
      </div>
    `}
  `;

  modal.classList.add("active");
}

// Генерация красивого диплома прямо в браузере через Canvas
function generateDiplomaCanvas() {
  sfx.playCorrect();
  const nameInput = document.getElementById("diploma-name-input");
  const userName = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : "Юный Гроссмейстер";

  const canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 800;
  const ctx = canvas.getContext("2d");

  // Фон - глубокий темный космос с градиентом
  const bgGrad = ctx.createLinearGradient(0, 0, 1200, 800);
  bgGrad.addColorStop(0, "#0a0f1d");
  bgGrad.addColorStop(1, "#03060b");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1200, 800);

  // Золотая рамка
  ctx.strokeStyle = "#f1c40f";
  ctx.lineWidth = 8;
  ctx.strokeRect(30, 30, 1140, 740);

  ctx.strokeStyle = "rgba(0, 255, 204, 0.4)";
  ctx.lineWidth = 2;
  ctx.strokeRect(45, 45, 1110, 710);

  // Заголовок
  ctx.textAlign = "center";
  ctx.fillStyle = "#f1c40f";
  ctx.font = "bold 32px sans-serif";
  ctx.fillText("ШАХМАТНАЯ ШКОЛА «ТАКТИКУС ФИНЧ»", 600, 120);

  // Титул диплома
  ctx.fillStyle = "#ffffff";
  ctx.font = "900 58px sans-serif";
  ctx.fillText("ДИПЛОМ МАГИСТРА", 600, 210);

  // Подзаголовок
  ctx.fillStyle = "#00ffcc";
  ctx.font = "20px sans-serif";
  ctx.fillText("НАСТОЯЩИЙ СЕРТИФИКАТ ПОДТВЕРЖДАЕТ, ЧТО", 600, 280);

  // Имя ученика
  ctx.fillStyle = "#f1c40f";
  ctx.font = "bold 52px sans-serif";
  ctx.fillText(userName.toUpperCase(), 600, 370);

  // Линия под именем
  ctx.strokeStyle = "#f1c40f";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(350, 395);
  ctx.lineTo(850, 395);
  ctx.stroke();

  // Описание подвига
  ctx.fillStyle = "#dddddd";
  ctx.font = "22px sans-serif";
  ctx.fillText("успешно исследовал наследие всех 15 Чемпионов и Легенд мира по шахматам,", 600, 460);
  ctx.fillText("овладел тактическим видением и завершил интерактивный курс проекта.", 600, 500);

  // Печать и значки
  ctx.font = "60px sans-serif";
  ctx.fillText("♚ ♛ ♞", 600, 600);

  // Дата и подпись
  const today = new Date().toLocaleDateString('ru-RU');
  ctx.fillStyle = "#8a99ad";
  ctx.font = "18px sans-serif";
  ctx.fillText(`Дата выдачи: ${today}`, 250, 690);
  ctx.fillText("Основатель: Тактикус Финч", 950, 690);

  // Скачивание файла
  const link = document.createElement("a");
  link.download = `Диплом_Тактикус_Финч_${userName.replace(/\s+/g, '_')}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}



    
    
</script>
