<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тактикус Финч — Вильгельм Стейниц AR</title>
    <!-- Подключаем стабильные версии A-Frame и MindAR -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        /* Красивый интерактивный оверлей сканирования */
        #scanning-overlay {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; left: 0; right: 0; top: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); color: #00ffcc; font-family: 'Segoe UI', Roboto, sans-serif; z-index: 100;
            transition: opacity 0.5s ease;
        }
        #scanning-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            border: 4px solid rgba(0,255,204,0.1); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: #00ffcc;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="scanning-overlay">
        <div class="spinner"></div>
        <div>Активация сканера «Тактикус Финч»...</div>
        <div style="font-size: 0.8em; color: #aaa; margin-top: 10px;">Наведите камеру на карточку Стейница</div>
    </div>

    <!-- Настройка сцены. По умолчанию uiScanning указывает на наш кастомный прелоадер -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiScanning: #scanning-overlay;" 
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- playsinline и webkit-playsinline критически важны для автозапуска видео на iPhone/iOS -->
            <video id="video-steinitz" src="./steinitz.mp4" preload="auto" loop="false" playsinline webkit-playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Индекс 0 — это первая загруженная картинка в скомпилированном targets.mind -->
        
            <!-- Соотношение сторон 1 к 1.54 (для евро-визитки 85х55мм). Видео идеально перекроет карту -->
            <a-video src="#video-steinitz" width="1" height="1.54" position="0 0 0" rotation="0 0 0"></a-video>
        

    </a-scene>

    <script>
        const targetSteinitz = document.getElementById("target-steinitz");
        const videoSteinitz = document.getElementById("video-video-steinitz");
        const overlay = document.getElementById("scanning-overlay");

        // Когда движок находит карточку вживую
        targetSteinitz.addEventListener("targetFound", () => {
            overlay.classList.add("hidden"); // прячем текст инструкции
            document.getElementById("video-steinitz").play(); // запускаем видео-шоу
        });

        // Когда карточку убирают из поля зрения камеры
        targetSteinitz.addEventListener("targetLost", () => {
            document.getElementById("video-steinitz").pause(); // ставим на паузу, чтобы не тратить батарею
        });
    </script>
</body>
</html>
