<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тактикус Финч — Вильгельм Стейниц AR</title>

    <!-- Правильные ссылки на проверенные библиотеки A-Frame и MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        
        #scanning-overlay {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: absolute; left: 0; right: 0; top: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); color: #00ffcc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            z-index: 100;
            transition: opacity 0.4s ease;
            text-align: center;
            padding: 20px;
        }
        #scanning-overlay.hidden { 
            opacity: 0; 
            pointer-events: none; 
        }
        .spinner {
            border: 4px solid rgba(0, 255, 204, 0.15); 
            width: 48px; height: 48px;
            border-radius: 50%; 
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite; 
            margin-bottom: 20px;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

    <div id="scanning-overlay">
        <div class="spinner"></div>
        <div style="font-size: 1.1em; font-weight: bold;">Активация сканера «Тактикус Финч»...</div>
        <div style="font-size: 0.85em; color: #ccc; margin-top: 8px;">Наведите камеру на визитку Стейница</div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./cards.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- muted необходим для iOS/Android, чтобы видео разрешалось запускать автоматически -->
            <video id="video-steinitz" src="./steinitz.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Таргет с индексом 0 -->
        <a-entity id="target-steinitz" mindar-image-target="targetIndex: 0">
            <!-- Соотношение сторон 1 к 1.54 под евро-визитку -->
            <a-video src="#video-steinitz" width="1" height="1.54" position="0 0 0" rotation="0 0 0"></a-video>
        </a-entity>

    </a-scene>

    <script>
        const target = document.getElementById("target-steinitz");
        const video = document.getElementById("video-steinitz");
        const overlay = document.getElementById("scanning-overlay");

        // Прячем оверлей, когда движок MindAR полностью загрузился и готов распознавать
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener("arReady", () => {
            // Сканер готов к работе
        });

        // Визитка попала в кадр
        target.addEventListener("targetFound", () => {
            overlay.classList.add("hidden");
            video.play();
        });

        // Визитка ушла из кадра
        target.addEventListener("targetLost", () => {
            video.pause();
        });
    </script>
</body>
</html>
