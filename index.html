<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тактикус Финч — Чемпионы мира по шахматам</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-aframe.prod.js"></script>

<style>
:root {
--accent-color: #00ffcc;
--accent-glow: rgba(0, 255, 204, 0.4);
}

body {
margin: 0;
overflow: hidden;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
user-select: none;
-webkit-tap-highlight-color: transparent;
background-color: #000;
}

/ Прелоадер /

scanner-hint {
position: absolute;
inset: 0;
background: radial-gradient(circle, rgba(10, 15, 24, 0.85) 0%, rgba(0,0,0,0.95) 100%);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
color: var(--accent-color);
z-index: 100;
text-align: center;
padding: 24px;
transition: opacity 0.4s ease;
pointer-events: none;
}

scanner-hint.hidden { opacity: 0; }
/ Контейнер прицела: занимает 72% ширины экрана и сохраняет пропорцию карточки /
.ar-reticle {
position: relative;
width: 72vw;
max-width: 320px;
aspect-ratio: 1 / 1.54; / Точные пропорции вашей AR-карточки /
border: 1px solid rgba(0, 255, 204, 0.15);
border-radius: 20px;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 24px;
overflow: hidden;
box-shadow: inset 0 0 35px rgba(0, 255, 204, 0.06);
}

/ Уголки делаем крупнее под новый размер /
.reticle-corner {
position: absolute;
width: 28px;
height: 28px;
border-color: var(--accent-color);
border-style: solid;
border-width: 0;
filter: drop-shadow(0 0 8px var(--accent-color));
}
.reticle-corner.top-left { top: 10px; left: 10px; border-top-width: 3.5px; border-left-width: 3.5px; border-top-left-radius: 8px; }
.reticle-corner.top-right { top: 10px; right: 10px; border-top-width: 3.5px; border-right-width: 3.5px; border-top-right-radius: 8px; }
.reticle-corner.bottom-left { bottom: 10px; left: 10px; border-bottom-width: 3.5px; border-left-width: 3.5px; border-bottom-left-radius: 8px; }
.reticle-corner.bottom-right { bottom: 10px; right: 10px; border-bottom-width: 3.5px; border-right-width: 3.5px; border-bottom-right-radius: 8px; }

/ Лазер проходит всю высоту рамки в процентах /
@keyframes scanLaser {
0% { top: 2%; opacity: 0.2; }
50% { opacity: 1; }
100% { top: 98%; opacity: 0.2; }
}

/ Угловые высокотехнологичные маркеры /
.reticle-corner {
position: absolute;
width: 20px;
height: 20px;
border-color: var(--accent-color);
border-style: solid;
border-width: 0;
filter: drop-shadow(0 0 6px var(--accent-color));
}
.reticle-corner.top-left { top: 8px; left: 8px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 6px; }
.reticle-corner.top-right { top: 8px; right: 8px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 6px; }
.reticle-corner.bottom-left { bottom: 8px; left: 8px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 6px; }
.reticle-corner.bottom-right { bottom: 8px; right: 8px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 6px; }

/ Сканирующий световой луч /
.laser-beam {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 3px;
background: linear-gradient(90deg, transparent 0%, var(--accent-color) 50%, transparent 100%);
box-shadow: 0 0 15px var(--accent-color), 0 0 30px var(--accent-color);
animation: scanLaser 2.2s ease-in-out infinite alternate;
}
@keyframes scanLaser {
0% { transform: translateY(10px); opacity: 0.3; }
50% { opacity: 1; }
100% { transform: translateY(300px); opacity: 0.3; }
}

/ Вращающиеся полукруги и орбиты /
.hud-circle {
position: absolute;
border-radius: 50%;
box-sizing: border-box;
}

/ Внешнее пунктирное кольцо /
.ring-outer {
width: 110px;
height: 110px;
border: 2px dashed var(--accent-color);
opacity: 0.7;
animation: rotateCW 8s linear infinite;
filter: drop-shadow(0 0 8px var(--accent-glow));
}

/ Внутренние полукруги /
.ring-inner {
width: 80px;
height: 80px;
border: 3px solid transparent;
border-top: 3px solid var(--accent-color);
border-bottom: 3px solid var(--accent-color);
animation: rotateCCW 2.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
}

@keyframes rotateCW {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
@keyframes rotateCCW {
0% { transform: rotate(0deg); }
100% { transform: rotate(-360deg); }
}

/ Пульсирующий шахматный символ /
.hud-chess-core {
font-size: 38px;
color: var(--accent-color);
text-shadow: 0 0 15px var(--accent-color), 0 0 25px var(--accent-glow);
animation: pulseCore 1.6s ease-in-out infinite;
z-index: 2;
line-height: 1;
}
@keyframes pulseCore {
0%, 100% { transform: scale(0.92); opacity: 0.75; }
50% { transform: scale(1.08); opacity: 1; }
}

/ Текстовый блок статуса /
.scanner-status {
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}
.status-badge {
font-size: 9px;
font-weight: 800;
letter-spacing: 1.5px;
padding: 3px 8px;
border-radius: 4px;
background: rgba(0, 255, 204, 0.12);
border: 1px solid var(--accent-color);
color: var(--accent-color);
margin-bottom: 4px;
}
.status-title {
font-size: 15px;
font-weight: 800;
letter-spacing: 1px;
color: #fff;
}
.status-sub {
font-size: 12px;
color: #7a8b9e;
}
/ Верхняя панель (HUD) /
.top-hud {
position: absolute;
top: 16px;
left: 16px;
right: 16px;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 120;
pointer-events: none;
}

.hud-btn {
pointer-events: auto;
background: rgba(12, 16, 26, 0.75);
border: 1px solid var(--accent-color);
color: #fff;
border-radius: 12px;
padding: 8px 14px;
display: inline-flex;
align-items: center;
gap: 6px;
font-size: 11px;
font-weight: 700;
letter-spacing: 0.5px;
text-transform: uppercase;
text-decoration: none;
backdrop-filter: blur(12px);
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px var(--accent-glow);
cursor: pointer;
transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
}
.hud-btn:active {
transform: scale(0.95);
}

bot-link-btn {
border-color: #00e5ff;
}

/ Нижнее эффектное меню /

interactive-dock {
position: absolute;
bottom: 24px;
left: 14px;
right: 14px;
display: none;
justify-content: space-between;
gap: 10px;
z-index: 110;
animation: dockRise 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes dockRise {
from { transform: translateY(40px); opacity: 0; }
to { transform: translateY(0); opacity: 1; }
}

.dock-btn {
flex: 1;
padding: 12px 6px;
border-radius: 14px;
background: linear-gradient(180deg, rgba(25, 32, 48, 0.85) 0%, rgba(10, 14, 22, 0.95) 100%);
border: 1.5px solid var(--accent-color);
color: #fff;
font-size: 11px;
font-weight: 800;
letter-spacing: 0.5px;
text-transform: uppercase;
backdrop-filter: blur(12px);
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
cursor: pointer;
text-align: center;
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.dock-btn span.icon {
font-size: 16px;
}
.dock-btn:active {
transform: scale(0.92);
box-shadow: 0 2px 8px var(--accent-glow);
background: var(--accent-color);
color: #000;
}

/ Модальные окна /
.modal-overlay {
position: absolute;
inset: 0;
background: rgba(4, 6, 12, 0.85);
display: flex;
align-items: center;
justify-content: center;
z-index: 200;
opacity: 0;
pointer-events: none;
transition: opacity 0.25s ease;
padding: 16px;
box-sizing: border-box;
backdrop-filter: blur(8px);
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-card {
background: linear-gradient(160deg, #121824 0%, #080b11 100%);
border: 1px solid var(--accent-color);
border-radius: 18px;
width: 100%;
max-width: 420px;
padding: 22px;
color: #fff;
position: relative;
box-shadow: 0 0 35px var(--accent-glow);
max-height: 85vh;
overflow-y: auto;
box-sizing: border-box;
}
.modal-close {
position: absolute;
top: 14px;
right: 14px;
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 255, 255, 0.15);
color: #aaa;
font-size: 11px;
font-weight: 700;
text-transform: uppercase;
border-radius: 8px;
padding: 7px 12px;
cursor: pointer;
transition: background 0.2s;
}
.modal-close:active { background: rgba(255, 255, 255, 0.2); color: #fff; }

.modal-title {
font-size: 18px;
font-weight: 800;
color: var(--accent-color);
margin-bottom: 4px;
padding-right: 65px;
letter-spacing: 0.3px;
}
.modal-subtitle {
font-size: 11px;
color: #8a99ad;
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 14px;
}

/ Вспомогательные блоки ссылок /
.external-promo-box {
margin-top: 15px;
padding: 12px;
background: rgba(255, 255, 255, 0.04);
border-radius: 10px;
border: 1px dashed rgba(255, 255, 255, 0.15);
text-align: center;
}
.action-link-btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
margin-top: 8px;
padding: 11px 16px;
width: 100%;
box-sizing: border-box;
border-radius: 10px;
background: var(--accent-color);
color: #000;
font-size: 11px;
font-weight: 800;
text-decoration: none;
text-transform: uppercase;
letter-spacing: 0.4px;
box-shadow: 0 4px 12px var(--accent-glow);
transition: transform 0.15s;
}
.action-link-btn:active { transform: scale(0.97); }
.action-link-btn.secondary {
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 255, 255, 0.2);
color: #fff;
box-shadow: none;
}

/ Биография /
.bio-section-title {
font-size: 12px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.5px;
color: var(--accent-color);
margin-top: 14px;
margin-bottom: 4px;
}
.bio-paragraph {
font-size: 13px;
line-height: 1.5;
color: #ccc;
margin-bottom: 8px;
text-align: justify;
}
.modal-quote {
font-style: italic;
color: #ddd;
font-size: 12px;
line-height: 1.45;
border-left: 3px solid var(--accent-color);
padding: 8px 12px;
margin: 12px 0;
background: rgba(255, 255, 255, 0.03);
border-radius: 0 8px 8px 0;
}

/ Задачи / Тесты /
.diagram-container {
width: 100%;
margin: 12px 0;
display: flex;
justify-content: center;
}
.diagram-img {
max-width: 250px;
width: 100%;
height: auto;
border: 2px solid rgba(255, 255, 255, 0.1);
border-radius: 10px;
background-color: #1a1e28;
box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.difficulty-badge {
display: inline-block;
font-size: 10px;
font-weight: 800;
text-transform: uppercase;
letter-spacing: 0.5px;
padding: 4px 8px;
border-radius: 6px;
background: rgba(255, 255, 255, 0.08);
color: var(--accent-color);
margin-bottom: 8px;
}
.puzzle-option-btn {
width: 100%;
text-align: left;
padding: 12px;
font-size: 12px;
margin-bottom: 8px;
border-radius: 10px;
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 255, 255, 0.12);
color: #fff;
cursor: pointer;
box-sizing: border-box;
transition: all 0.2s;
}
.puzzle-option-btn:active { background: rgba(255, 255, 255, 0.15); border-color: var(--accent-color); }

/ Статистика /
.stat-row { margin-bottom: 12px; }
.stat-header {
display: flex;
justify-content: space-between;
font-size: 11px;
font-weight: 600;
margin-bottom: 4px;
color: #ccc;
}
.stat-track {
height: 7px;
background: rgba(255, 255, 255, 0.08);
border-radius: 4px;
overflow: hidden;
}
.stat-fill {
height: 100%;
background: var(--accent-color);
box-shadow: 0 0 8px var(--accent-glow);
border-radius: 4px;
}
.skill-box {
margin-top: 16px;
padding: 14px;
background: rgba(255, 255, 255, 0.03);
border-radius: 10px;
border: 1px solid rgba(255, 255, 255, 0.08);
}

/ ================= HOTSEAT АРЕНА (SIDE-BY-SIDE) ================= /

hotseat-arena {
position: absolute;
inset: 0;
background: #080c14;
z-index: 250;
display: none;
flex-direction: column;
overflow: hidden;
user-select: none;
}

hotseat-arena.active { display: flex; }
.hs-zone {
flex: 1;
display: flex;
flex-direction: column;
justify-content: space-between;
padding: 8px 12px;
box-sizing: border-box;
position: relative;
}

/ Верхняя зона игрока 2 — развернута на 180° к сопернику /
.hs-zone.top-player {
transform: rotate(180deg);
border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

/ Центральный разделитель /
.hs-divider {
height: 32px;
background: #0e1422;
border-top: 1px solid rgba(255, 255, 255, 0.15);
border-bottom: 1px solid rgba(255, 255, 255, 0.15);
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 14px;
z-index: 10;
}
.hs-round-badge {
font-size: 11px;
font-weight: 800;
color: #ff0055;
letter-spacing: 1px;
}
.hs-exit-btn {
background: rgba(255, 50, 50, 0.15);
border: 1px solid #ff4d6d;
color: #ff4d6d;
padding: 2px 8px;
border-radius: 6px;
font-size: 9px;
font-weight: 800;
cursor: pointer;
}

/ Верхняя/нижняя полоска состояния /
.hs-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 3px;
}
.hs-hero-name {
font-size: 11px;
font-weight: 800;
text-transform: uppercase;
}
.hs-hp-val {
font-size: 11px;
font-weight: 800;
}
.hs-hp-track {
height: 5px;
background: rgba(255,255,255,0.1);
border-radius: 3px;
overflow: hidden;
}
.hs-hp-fill {
height: 100%;
transition: width 0.3s ease;
}

/ Основная эргономичная зона раунда /
.hs-content-row {
flex: 1;
display: flex;
align-items: center;
gap: 10px;
margin: 4px 0;
min-height: 0; / Важно для сжатия во flex /
}

/ Крупная шахматная диаграмма слева /
.hs-board-img {
height: 100%;
max-height: 165px;
aspect-ratio: 1 / 1;
object-fit: contain;
border-radius: 8px;
border: 1.5px solid rgba(255, 255, 255, 0.25);
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
background: #111622;
}

/ Правая колонка с заданием и кнопками /
.hs-interactive-col {
flex: 1;
height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
gap: 4px;
}

.hs-prompt-badge {
font-size: 9px;
font-weight: 800;
color: #00ffcc;
text-transform: uppercase;
letter-spacing: 0.5px;
line-height: 1.2;
}

.hs-options-list {
display: flex;
flex-direction: column;
gap: 4px;
width: 100%;
}

.hs-opt-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.15);
color: #fff;
padding: 7px 8px;
border-radius: 6px;
font-size: 10px;
font-weight: 700;
cursor: pointer;
text-align: left;
line-height: 1.2;
transition: all 0.1s;
}
.hs-opt-btn:active {
transform: scale(0.96);
background: rgba(255, 255, 255, 0.25);
}

/ Всплывающее окно победы /
.hs-feedback-toast {
position: absolute;
inset: 0;
background: rgba(4, 6, 12, 0.95);
display: none;
align-items: center;
justify-content: center;
flex-direction: column;
z-index: 20;
text-align: center;
padding: 20px;
}
.hs-feedback-toast.active { display: flex; }

</style>
</head>

<body>

<div id="scanner-hint">
<!-- Кибер-сканер -->
<div class="ar-reticle">
<div class="reticle-corner top-left"></div>
<div class="reticle-corner top-right"></div>
<div class="reticle-corner bottom-left"></div>
<div class="reticle-corner bottom-right"></div>

<div class="laser-beam"></div>

<div class="hud-circle ring-outer"></div>
<div class="hud-circle ring-inner"></div>
<div class="hud-chess-core">♚</div>
</div>

<div class="scanner-status">
<div class="status-badge">AR СКАНЕР АКТИВЕН</div>
<div class="status-title">НАВЕДИТЕ НА КАРТОЧКУ</div>
<div class="status-sub">Стейниц • Ласкер • Капабланка</div>
</div>
</div>

<!-- Верхний HUD -->
<div class="top-hud">
<a id="bot-link-btn" class="hud-btn" href="https://max.ru/se14097294_bot" target="_blank">
<span>🤖</span> БОТ ФИНЧ
</a>

</div>

<button class="dock-btn" onclick="openModal('stats')">
<span>Характеристики</span>
</button>

<button class="dock-btn" onclick="startHotseatDuel()" style="border-color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.4);">

</div>
</div>

<!-- Сцена MindAR -->
<a-scene
mindar-image="imageTargetSrc: ./cards.mind; maxTrack: 1; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5;"
color-space="sRGB"

vr-mode-ui="enabled: false"

<script>
const HEROES = {
0: {
name: "Вильгельм Стейниц",
title: "I Чемпион мира по шахматам (1886—1894)",
color: "#00ffcc",
colorGlow: "rgba(0, 255, 204, 0.4)",
quote: "«Шахматы не для слабонервных. Здесь побеждает тот, чья позиция надежна как гранит».",
bio: [
{
title: "Происхождение и юность",
text: "Вильгельм Стейниц родился в Праге в бедной семье. Обладая слабым здоровьем и хромотой с ранних лет, он компенсировал физические ограничения выдающимися способностями к математике. В Вене он открыл в себе уникальный комбинационный и позиционный дар."
},
{
title: "Революция в теории шахмат",
text: "Стейниц первым научно обосновал, что атака успешна только при наличии позиционного перевеса. Он заложил фундаментальные правила центра и слабых полей."
},

document.documentElement.style.setProperty('--accent-color', hero.color);

soundBtn.style.borderColor = hero.color;
}

const activeVideo = document.getElementById(vid-${currentHeroId});
if (activeVideo) activeVideo.pause();

// 2. Виброотклик при клике по кнопке
if (navigator.vibrate) navigator.vibrate(35);

if (type === 'bio') {
modalContent.innerHTML = `
<div class="modal-title">${hero.name}</div>
<div class="modal-subtitle">${hero.title}</div>
<div class="modal-quote">${hero.quote}</div>
${hero.bio.map(sec => `
<div class="bio-section-title">${sec.title}</div>
<div class="bio-paragraph">${sec.text}</div>
`).join('')}
`;
} else if (type === 'test') {
currentPuzzleIndex = 0;
testScore = 0;
renderPuzzleQuestion();
} else if (type === 'stats') {
modalContent.innerHTML = `
<div class="modal-title">Характеристики</div>
<div class="modal-subtitle">${hero.name}</div>
${hero.stats.map(s => `
<div class="stat-row">
<div class="stat-header"><span>${s.name}</span><span>${s.val}%</span></div>
<div class="stat-track"><div class="stat-fill" style="width: ${s.val}%"></div></div>
</div>
`).join('')}
<div class="skill-box">
<div style="font-size: 11px; color: var(--accent-color); font-weight: 700; text-transform: uppercase;">Ключевой навык:</div>
<div style="font-size: 14px; font-weight: bold; margin-top: 3px;">${hero.skillName}</div>
<div style="font-size: 12px; color: #aaa; margin-top: 5px; line-height: 1.4;">${hero.skillDesc}</div>
</div>
<div class="external-promo-box">
<div style="font-size: 12px; font-weight: 600;">Хотите записаться на занятия?</div>
<div style="font-size: 11px; color: #aaa; margin-top: 3px;">Узнайте расписание и подробности о школе:</div>
<a href="https://max.ru/se14097294_bot" target="_blank" class="action-link-btn">
🤖 Тактикус Финч
</a>
<a href="https://tacticusfinch.ru/" target="_blank" class="action-link-btn">
Официальный сайт шахматной школы
</a>
</div>
`;
}

modal.classList.add("active");
}

// Рендер конкретного вопроса теста (всего 7)
function renderPuzzleQuestion() {
const hero = HEROES[currentHeroId];
const p = hero.puzzles[currentPuzzleIndex];

// Отображаем картинку только если она есть в вопросе (для тактики)
const diagramHtml = p.image
? `<div class="diagram-container">
<img class="diagram-img" src="${p.image}" alt="Шахматная диаграмма" onerror="this.style.display='none'">
</div>`
: '';

modalContent.innerHTML = `
<div class="modal-title">Тест чемпиона</div>
<div class="modal-subtitle">${hero.name} — Вопрос ${currentPuzzleIndex + 1} из ${hero.puzzles.length}</div>

<div class="difficulty-badge">${p.difficulty}</div>
<div style="font-size: 13px; color: #ccc; line-height: 1.45; margin-bottom: 8px;">${p.desc}</div>

${diagramHtml}

<div id="puzzle-feedback" style="display:none; font-size: 12px; line-height: 1.4; margin: 10px 0; padding: 10px; border-radius: 8px;"></div>

<div id="puzzle-options">
${p.options.map((opt, i) => `
<button class="puzzle-option-btn" onclick="checkAnswer(${i})">
${opt.text}
</button>
`).join('')}
</div>

<div id="puzzle-next-container" style="display:none; margin-top: 10px;">
<button class="action-link-btn" style="border:none; cursor:pointer;" onclick="nextPuzzle()">
${currentPuzzleIndex + 1 < hero.puzzles.length ? 'Следующий вопрос →' : 'Посмотреть результат 🏆'}
</button>
</div>
`;
}

// Проверка ответа
function checkAnswer(index) {
const hero = HEROES[currentHeroId];
const p = hero.puzzles[currentPuzzleIndex];
const opt = p.options[index];
const fb = document.getElementById("puzzle-feedback");
const nextContainer = document.getElementById("puzzle-next-container");
const optionsContainer = document.getElementById("puzzle-options");

// Блокируем варианты ответов
const buttons = optionsContainer.getElementsByTagName("button");
for (let btn of buttons) {
btn.disabled = true;
btn.style.opacity = "0.6";
btn.style.cursor = "default";
}

fb.style.display = "block";

if (opt.correct) {
testScore++;
if (navigator.vibrate) navigator.vibrate([70, 50, 70]);
fb.style.background = "rgba(46, 204, 113, 0.2)";
fb.style.color = "#2ecc71";
fb.style.border = "1px solid #2ecc71";
fb.innerHTML = <b>ВЕРНО!</b> ${opt.comment};
} else {
if (navigator.vibrate) navigator.vibrate(180);
fb.style.background = "rgba(231, 76, 60, 0.2)";
fb.style.color = "#e74c3c";
fb.style.border = "1px solid #e74c3c";
fb.innerHTML = <b>НЕВЕРНО.</b> ${opt.comment};
}

nextContainer.style.display = "block";
}

function nextPuzzle() {
currentPuzzleIndex++;
const hero = HEROES[currentHeroId];

if (currentPuzzleIndex < hero.puzzles.length) {
renderPuzzleQuestion();
} else {
renderTestResult();
}
}

function renderTestResult() {
const hero = HEROES[currentHeroId];
let evaluation = "";

if (testScore >= 6) {
evaluation = "Великолепно! Вы настоящий знаток истории и блестящий тактик.";
} else if (testScore >= 4) {
evaluation = "Хороший результат! Большинство ловушек и фактов вам покорились.";
} else {
evaluation = "Неплохая попытка! Изучите биографию еще раз и попробуйте улучшить счет.";
}

modalContent.innerHTML = `
<div class="modal-title">Тест завершен</div>
<div class="modal-subtitle">${hero.name}</div>

<div style="margin: 16px 0; padding: 18px; background: rgba(255, 255, 255, 0.04); border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.08);">
<div style="font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 0.5px;">Ваш результат:</div>
<div style="font-size: 34px; font-weight: 800; color: var(--accent-color); margin: 6px 0;">${testScore} из ${hero.puzzles.length}</div>
<div style="font-size: 13px; color: #ddd; line-height: 1.4;">${evaluation}</div>
</div>

<div class="external-promo-box">
<div style="font-size: 12px; font-weight: 700; margin-bottom: 2px;">Шахматная школа</div>
<div style="font-size: 11px; color: #aaa; margin-bottom: 8px;">Запись на занятия и информация:</div>

<a href="https://max.ru/se14097294_bot" target="_blank" class="action-link-btn">
🤖 Записаться на занятия (Бот Финч)
</a>

<a href="https://lichess.org/learn" target="_blank" class="action-link-btn secondary" style="margin-top: 6px;">
Изучить базовые механики
</a>
</div>

<button class="action-link-btn secondary" style="width: 100%; margin-top: 10px; cursor: pointer;" onclick="openModal('test')">Пройти заново</button>
`;
}

// Закрытие модального окна (возобновление видео)
function closeModal() {
modal.classList.remove("active");
if (currentHeroId !== null) {
const activeVideo = document.getElementById(vid-${currentHeroId});
if (activeVideo) {
activeVideo.play().catch(() => {});
}
}
}

// ================= ЛОГИКА ДУЭЛИ (БОЙ ДО ПОЛНОЙ ПОБЕДЫ) =================
let duelState = {
active: false,
p1Hero: null,
p2Hero: null,
p1Hp: 100,
p2Hp: 100,
roundIndex: 0,
roundLocked: false,
deck: [] // динамическая колода задач
};

function startHotseatDuel() {
if (currentHeroId === null) return;

const activeVideo = document.getElementById(vid-${currentHeroId});
if (activeVideo) activeVideo.pause();

const p1 = HEROES[currentHeroId];
const otherIds = Object.keys(HEROES).map(Number).filter(id => id !== currentHeroId);
const p2Id = otherIds[Math.floor(Math.random() * otherIds.length)];
const p2 = HEROES[p2Id];

duelState.p1Hero = p1;
duelState.p2Hero = p2;
duelState.p1Hp = 100;
duelState.p2Hp = 100;
duelState.roundIndex = 0;
duelState.roundLocked = false;

// Формируем колоду: приоритет тактическим задачам
fillDuelDeck();

document.getElementById("p1-name").innerText = p1.name;
document.getElementById("p1-name").style.color = p1.color;
document.getElementById("p1-hp-bar").style.background = p1.color;

document.getElementById("p2-name").innerText = p2.name;
document.getElementById("p2-name").style.color = p2.color;
document.getElementById("p2-hp-bar").style.background = p2.color;

document.getElementById("hs-gameover").classList.remove("active");
document.getElementById("hotseat-arena").classList.add("active");

updateHpBars();
loadNextDuelRound();
}

// Заполнение и перемешивание колоды
function fillDuelDeck() {
duelState.deck = [
...duelState.p1Hero.puzzles,
...duelState.p2Hero.puzzles
].sort(() => Math.random() - 0.5);
}

function updateHpBars() {
document.getElementById("p1-hp-num").innerText = ${duelState.p1Hp}%;
document.getElementById("p1-hp-bar").style.width = ${duelState.p1Hp}%;
document.getElementById("p2-hp-num").innerText = ${duelState.p2Hp}%;
document.getElementById("p2-hp-bar").style.width = ${duelState.p2Hp}%;
}

function loadNextDuelRound() {
// БОЙ ИДЕТ ТОЛЬКО ДО 0% HP! Никаких лимитов раундов!
if (duelState.p1Hp <= 0 || duelState.p2Hp <= 0) {
endDuel();
return;
}

duelState.roundLocked = false;
duelState.roundIndex++;

// Если задачи закончились, а победитель не выявлен — перемешиваем заново
if (duelState.deck.length === 0) {
fillDuelDeck();
}
const q = duelState.deck.pop();
duelState.currentQuestion = q;

document.getElementById("hs-round-info").innerText = РАУНД ${duelState.roundIndex};

const hasImage = !!q.image;

['p1', 'p2'].forEach(player => {
const imgEl = document.getElementById(${player}-board-img);
const promptEl = document.getElementById(${player}-prompt);
const optContainer = document.getElementById(${player}-options);

if (hasImage) {
imgEl.src = q.image;
imgEl.style.display = "block";
// Компактный подсказчик для экономии места
promptEl.innerText = "🎯 НАЙДИТЕ ЛУЧШИЙ ХОД:";
promptEl.style.color = "var(--accent-color)";
} else {
imgEl.style.display = "none";
promptEl.innerText = q.desc;
promptEl.style.color = "#eee";
}

// Рендерим варианты ответов
optContainer.innerHTML = q.options.map((opt, i) => `
<button class="hs-opt-btn" onclick="handleDuelTap('${player}', ${i})">
${opt.text}
</button>
`).join('');
});
}

function handleDuelTap(player, optIndex) {
if (duelState.roundLocked) return;
duelState.roundLocked = true;

const q = duelState.currentQuestion;
const isCorrect = q.options[optIndex].correct;

if (navigator.vibrate) navigator.vibrate(isCorrect ? 70 : 180);

// Урон за попадание: -25%, штраф за ошибку (зевок): -15%
if (player === 'p1') {
if (isCorrect) {
duelState.p2Hp = Math.max(0, duelState.p2Hp - 25);
flashPrompt('p1', '⚡ ТОЧНЫЙ ХОД! (-25%)', '#2ecc71');
flashPrompt('p2', '💥 ПРОПУЩЕН УДАР! (-25%)', '#e74c3c');
} else {
duelState.p1Hp = Math.max(0, duelState.p1Hp - 15);
flashPrompt('p1', '❌ ЗЕВОК! ОШИБКА (-15%)', '#e74c3c');
flashPrompt('p2', '🛡️ СОПЕРНИК ОШИБСЯ!', '#2ecc71');
}
} else {
if (isCorrect) {
duelState.p1Hp = Math.max(0, duelState.p1Hp - 25);
flashPrompt('p2', '⚡ ТОЧНЫЙ ХОД! (-25%)', '#2ecc71');
flashPrompt('p1', '💥 ПРОПУЩЕН УДАР! (-25%)', '#e74c3c');
} else {
duelState.p2Hp = Math.max(0, duelState.p2Hp - 15);
flashPrompt('p2', '❌ ЗЕВОК! ОШИБКА (-15%)', '#e74c3c');
flashPrompt('p1', '🛡️ СОПЕРНИК ОШИБСЯ!', '#2ecc71');
}
}

updateHpBars();

// Переход к следующему раунду
setTimeout(() => {
loadNextDuelRound();
}, 1200);
}

function flashPrompt(player, text, color) {
const promptEl = document.getElementById(${player}-prompt);
promptEl.innerHTML = <span style="color: ${color}; font-size: 11px; font-weight: 900;">${text}</span>;
}

function endDuel() {
const goModal = document.getElementById("hs-gameover");
const title = document.getElementById("hs-winner-title");
const desc = document.getElementById("hs-winner-desc");

let winner = null;
if (duelState.p1Hp <= 0 && duelState.p2Hp > 0) winner = duelState.p2Hero;
else if (duelState.p2Hp <= 0 && duelState.p1Hp > 0) winner = duelState.p1Hero;

if (winner) {
title.innerText = "ШАХ И МАТ!";
title.style.color = winner.color;
desc.innerHTML = Победу одержал <b>${winner.name}</b>!<br>Король соперника повержен на ${duelState.roundIndex} раунде.;
}

goModal.classList.add("active");
}

function exitDuel() {
document.getElementById("hotseat-arena").classList.remove("active");
if (currentHeroId !== null) {
const vid = document.getElementById(vid-${currentHeroId});
if (vid) vid.play().catch(() => {});
}
}

</script>

<!-- АРЕНА ДУЭЛИ ДЛЯ ДВУХ ИГРОКОВ (ЭРГОНОМИЧНЫЙ ЛЕЙАУТ) -->
<div id="hotseat-arena">
<!-- Половина Игрока 2 (развернута вверх ногами) -->
<div id="zone-p2" class="hs-zone top-player">
<div>
<div class="hs-header">
<span id="p2-name" class="hs-hero-name">Игрок 2</span>
<span id="p2-hp-num" class="hs-hp-val">100%</span>
</div>
<div class="hs-hp-track">
<div id="p2-hp-bar" class="hs-hp-fill" style="width: 100%;"></div>
</div>
</div>

<div class="hs-content-row">
<img id="p2-board-img" class="hs-board-img" src="" alt="Доска" style="display: none;">
<div class="hs-interactive-col">
<div id="p2-prompt" class="hs-prompt-badge">РАУНД 1</div>
<div id="p2-options" class="hs-options-list"></div>
</div>
</div>
</div>

<!-- Центральный разделитель -->
<div class="hs-divider">
<div id="hs-round-info" class="hs-round-badge">БОЙ ДО ПОБЕДНОГО МАТА</div>
<button class="hs-exit-btn" onclick="exitDuel()">СДАТЬСЯ ✕</button>
</div>

<!-- Половина Игрока 1 (нормальная ориентация) -->
<div id="zone-p1" class="hs-zone">
<div class="hs-content-row">
<img id="p1-board-img" class="hs-board-img" src="" alt="Доска" style="display: none;">
<div class="hs-interactive-col">
<div id="p1-prompt" class="hs-prompt-badge">РАУНД 1</div>
<div id="p1-options" class="hs-options-list"></div>
</div>
</div>

<div>
<div class="hs-hp-track">
<div id="p1-hp-bar" class="hs-hp-fill" style="width: 100%;"></div>
</div>
<div class="hs-header" style="margin-top: 3px;">
<span id="p1-name" class="hs-hero-name">Игрок 1</span>
<span id="p1-hp-num" class="hs-hp-val">100%</span>
</div>
</div>
</div>

<!-- Экран завершения боя -->
<div id="hs-gameover" class="hs-feedback-toast">
<div id="hs-winner-title" style="font-size: 26px; font-weight: 900; margin-bottom: 6px;">ШАХ И МАТ!</div>
<div id="hs-winner-desc" style="font-size: 13px; color: #ccc; margin-bottom: 20px;"></div>
<button class="action-link-btn" style="max-width: 220px; cursor: pointer;" onclick="startHotseatDuel()">Реванш 🔄</button>
<button class="action-link-btn secondary" style="max-width: 220px; margin-top: 8px; cursor: pointer;" onclick="exitDuel()">В меню</button>
</div>
</div>

</body>
</html>
