<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тактикус Финч — Чемпионы мира по шахматам</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
        :root {
            --accent-color: #00ffcc;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #000;
        }

        /* Прелоадер */
        #scanner-hint {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #00ffcc;
            z-index: 100;
            text-align: center;
            padding: 24px;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #scanner-hint.hidden { opacity: 0; }
        .spinner {
            border: 3px solid rgba(0, 255, 204, 0.2);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Кнопка включения звука */
        #sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 12, 18, 0.85);
            border: 1px solid var(--accent-color);
            color: #fff;
            border-radius: 8px;
            padding: 9px 16px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 120;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* Нижнее меню */
        #interactive-dock {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            display: none;
            justify-content: space-between;
            gap: 10px;
            z-index: 110;
        }
        .dock-btn {
            flex: 1;
            padding: 13px 6px;
            border-radius: 10px;
            background: rgba(12, 15, 22, 0.88);
            border: 1px solid var(--accent-color);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, background-color 0.2s;
        }
        .dock-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Модальные окна */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
            box-sizing: border-box;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: #0d1117;
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            color: #fff;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            max-height: 86vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #aaa;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 4px;
            padding-right: 70px;
            letter-spacing: 0.3px;
        }
        .modal-subtitle {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* Биография */
        .bio-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            margin-top: 14px;
            margin-bottom: 4px;
        }
        .bio-paragraph {
            font-size: 13px;
            line-height: 1.5;
            color: #ccc;
            margin-bottom: 8px;
            text-align: justify;
        }
        .modal-quote {
            font-style: italic;
            color: #ddd;
            font-size: 12px;
            line-height: 1.45;
            border-left: 2px solid var(--accent-color);
            padding: 6px 10px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.03);
        }

        /* Тест и Картинка-Диаграмма */
        .diagram-container {
            width: 100%;
            margin: 10px 0;
            display: flex;
            justify-content: center;
        }
        .diagram-img {
            max-width: 250px;
            width: 100%;
            height: auto;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #1a1e28;
        }
        .difficulty-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-color);
            margin-bottom: 6px;
        }
        .puzzle-option-btn {
            width: 100%;
            text-align: left;
            padding: 11px;
            font-size: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .puzzle-option-btn:active { background: rgba(255, 255, 255, 0.15); }

        /* Статы */
        .stat-row { margin-bottom: 12px; }
        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ccc;
        }
        .stat-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
        }
        .skill-box {
            margin-top: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <div id="scanner-hint">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.5px;">НАВЕДИТЕ КАМЕРУ НА ПЕРСОНАЖА</div>
    </div>

    <button id="sound-toggle">ЗВУК: ВЫКЛ</button>

    <div id="interactive-dock">
        <button class="dock-btn" onclick="openModal('bio')">Биография</button>
        <button class="dock-btn" onclick="openModal('test')">Тест</button>
        <button class="dock-btn" onclick="openModal('stats')">Характеристики</button>

        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">Закрыть</button>
            <div id="modal-content"></div>

    <a-scene 
        mindar-image="imageTargetSrc: ./cards.mind; maxTrack: 1; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 8;" 
        color-space="sRGB" 
        renderer="colorManagement: true" 
        vr-mode-ui="enabled: false"

            <video id="vid-1" src="./lasker.mp4" loop="true" playsinline webkit-playsinline muted preload="metadata"></video>
            <video id="vid-2" src="./capablanca.mp4" loop="true" playsinline webkit-playsinline muted preload="metadata"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-0" mindar-image-target="targetIndex: 0">

        <a-entity id="target-1" mindar-image-target="targetIndex: 1">
            <a-video src="#vid-1" width="1" height="1.54" position="0 0 0"></a-video>

            <a-video src="#vid-2" width="1" height="1.54" position="0 0 0"></a-video>
        </a-entity>

    </a-scene>

                        desc: "Ход черных. Капабланка находит кратчайший путь к реализации проходной пешки:",
                        options: [
                            { text: "Ладья c2 — блокада короля", correct: true, comment: "Верно! Отсечение короля гарантирует беспрепятственный проход пешки в ферзи." },
                            { text: "Немедленное движение пешки вперед", correct: false, comment: "Король белых успевает задержать проходную." },
                            { text: "Шах ладьей сзади", correct: false, comment: "Лишний ход, усложняющий эндшпиль." }
                        ]
                    },
                    {
                        difficulty: "Уровень 3: Сложный",
                        image: "./c3.png",
                        desc: "Москва, 1914 год. Ход черных. Капабланка наносит удар феноменальной геометрии:",
                        options: [
                            { text: "Ладья e1+ — размен ладей", correct: false, comment: "Приводит к равному эндшпилю без выигрыша." },
                            { text: "Ферзь b2! Вторжение ферзя под бой", correct: true, comment: "Блестяще! Слабость первой горизонтали белых приводит к неизбежному краху." },
                            { text: "Пешка a5 — движение на ферзевом фланге", correct: false, comment: "Слишком медленно. Белые успевают защититься." }
                        ]
                    }
                ]
            }
        };

        let currentHeroId = null;
        let isMuted = true;
        let lostTimer = null;

        // Переменные состояния интерактивного теста
        let currentPuzzleIndex = 0;
        let testScore = 0;

        const hint = document.getElementById("scanner-hint");
        const dock = document.getElementById("interactive-dock");
        const soundBtn = document.getElementById("sound-toggle");
        const modal = document.getElementById("modal-container");
        const modalContent = document.getElementById("modal-content");

        // Слушатели таргетов
        [0, 1, 2].forEach(id => {
            const targetEl = document.getElementById(`target-${id}`);
            const videoEl = document.getElementById(`vid-${id}`);

            targetEl.addEventListener("targetFound", () => {
                if (lostTimer) clearTimeout(lostTimer);
                
                currentHeroId = id;
                applyHeroTheme(HEROES[id].color);

                hint.classList.add("hidden");
                dock.style.display = "flex";
                soundBtn.style.display = "flex";

                videoEl.muted = isMuted;
                videoEl.play().catch(() => {});
            });

            targetEl.addEventListener("targetLost", () => {
                lostTimer = setTimeout(() => {
                    videoEl.pause();
                    dock.style.display = "none";
                    soundBtn.style.display = "none";
                    hint.classList.remove("hidden");
                    closeModal();
                }, 1200);
            });
        });

        function applyHeroTheme(color) {
            document.documentElement.style.setProperty('--accent-color', color);
            soundBtn.style.borderColor = color;
        }

        soundBtn.addEventListener("click", () => {
            if (currentHeroId === null) return;
            const vid = document.getElementById(`vid-${currentHeroId}`);
            isMuted = !isMuted;
            vid.muted = isMuted;
            soundBtn.innerText = isMuted ? "ЗВУК: ВЫКЛ" : "ЗВУК: ВКЛ";
        });

        function openModal(type) {
            if (currentHeroId === null) return;
            const hero = HEROES[currentHeroId];

            if (type === 'bio') {
                modalContent.innerHTML = `
                    <div class="modal-title">${hero.name}</div>
                    <div class="modal-subtitle">${hero.title}</div>
                    <div class="modal-quote">${hero.quote}</div>
                    ${hero.bio.map(sec => `
                        <div class="bio-section-title">${sec.title}</div>
                        <div class="bio-paragraph">${sec.text}</div>
                    `).join('')}
                `;
            } else if (type === 'test') {
                currentPuzzleIndex = 0;
                testScore = 0;
                renderPuzzleQuestion();
            } else if (type === 'stats') {
                modalContent.innerHTML = `
                    <div class="modal-title">Характеристики</div>
                    <div class="modal-subtitle">${hero.name}</div>
                    ${hero.stats.map(s => `
                        <div class="stat-row">
                            <div class="stat-header"><span>${s.name}</span><span>${s.val}%</span></div>
                            <div class="stat-track"><div class="stat-fill" style="width: ${s.val}%"></div></div>
                        </div>
                    `).join('')}
                    <div class="skill-box">
                        <div style="font-size: 11px; color: var(--accent-color); font-weight: 700; text-transform: uppercase;">Ключевой навык:</div>
                        <div style="font-size: 13px; font-weight: bold; margin-top: 2px;">${hero.skillName}</div>
                        <div style="font-size: 12px; color: #aaa; margin-top: 4px; line-height: 1.4;">${hero.skillDesc}</div>
                    </div>
                `;
            }

            modal.classList.add("active");
        }

        // Рендер конкретного вопроса теста
        function renderPuzzleQuestion() {
            const hero = HEROES[currentHeroId];
            const p = hero.puzzles[currentPuzzleIndex];

            modalContent.innerHTML = `
                <div class="modal-title">Тест чемпиона</div>
                <div class="modal-subtitle">${hero.name} — Задание ${currentPuzzleIndex + 1} из 3</div>
                
                <div class="difficulty-badge">${p.difficulty}</div>
                <div style="font-size: 13px; color: #ccc; line-height: 1.45; margin-bottom: 8px;">${p.desc}</div>

                <div class="diagram-container">
                    <img class="diagram-img" src="${p.image}" alt="Шахматная диаграмма" onerror="this.style.display='none'">
                </div>
                
                <div id="puzzle-feedback" style="display:none; font-size: 12px; line-height: 1.4; margin: 10px 0; padding: 10px; border-radius: 6px;"></div>

                <div id="puzzle-options">
                    ${p.options.map((opt, i) => `
                        <button class="puzzle-option-btn" onclick="checkAnswer(${i})">
                            ${opt.text}
                        </button>
                    `).join('')}
                </div>

                <div id="puzzle-next-container" style="display:none; margin-top: 10px;">
                    <button class="dock-btn" style="width: 100%;" onclick="nextPuzzle()">Следующее задание</button>
                </div>
            `;
        }

        // Проверка ответа
        function checkAnswer(index) {
            const hero = HEROES[currentHeroId];
            const p = hero.puzzles[currentPuzzleIndex];
            const opt = p.options[index];
            const fb = document.getElementById("puzzle-feedback");
            const nextContainer = document.getElementById("puzzle-next-container");
            const optionsContainer = document.getElementById("puzzle-options");

            // Блокируем кнопки после клика
            const buttons = optionsContainer.getElementsByTagName("button");
            for (let btn of buttons) {
                btn.disabled = true;
                btn.style.opacity = "0.6";
                btn.style.cursor = "default";
            }

            fb.style.display = "block";

            if (opt.correct) {
                testScore++;
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                fb.style.background = "rgba(46, 204, 113, 0.2)";
                fb.style.color = "#2ecc71";
                fb.style.border = "1px solid #2ecc71";
                fb.innerHTML = `ВЕРНО. ${opt.comment}`;
            } else {
                if (navigator.vibrate) navigator.vibrate(200);
                fb.style.background = "rgba(231, 76, 60, 0.2)";
                fb.style.color = "#e74c3c";
                fb.style.border = "1px solid #e74c3c";
                fb.innerHTML = `НЕВЕРНО. ${opt.comment}`;
            }

            nextContainer.style.display = "block";
        }

        // Переход к следующему вопросу или финальному результату
        function nextPuzzle() {
            currentPuzzleIndex++;
            const hero = HEROES[currentHeroId];

            if (currentPuzzleIndex < hero.puzzles.length) {
                renderPuzzleQuestion();
            } else {
                renderTestResult();
            }
        }

        // Итог прохождения теста
        function renderTestResult() {
            const hero = HEROES[currentHeroId];
            let evaluation = "";

            if (testScore === 3) {
                evaluation = "Идеальный результат. Вы мыслите на уровне чемпиона мира!";
            } else if (testScore === 2) {
                evaluation = "Хороший результат. Стратегическое понимание на высоком уровне.";
            } else if (testScore === 1) {
                evaluation = "Базовый уровень пройден. Рекомендуется повторить позиционные принципы.";
            } else {
                evaluation = "Тест не пройден. Потренируйтесь и попробуйте снова.";
            }

            modalContent.innerHTML = `
                <div class="modal-title">Тест завершен</div>
                <div class="modal-subtitle">${hero.name}</div>
                
                <div style="margin: 20px 0; padding: 16px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; text-align: center;">
                    <div style="font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 0.5px;">Итоговый счет:</div>
                    <div style="font-size: 32px; font-weight: 800; color: var(--accent-color); margin: 6px 0;">${testScore} из 3</div>
                    <div style="font-size: 13px; color: #ddd; line-height: 1.4; margin-top: 10px;">${evaluation}</div>
                </div>

                <button class="dock-btn" style="width: 100%;" onclick="openModal('test')">Пройти тест заново</button>
            `;
        }

        function closeModal() {
            modal.classList.remove("active");
        }
    </script>
</body>
</html>
